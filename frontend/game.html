<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMAKE ENGINE — Sprint 0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }
  #header {
    color: #ff4400;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.7;
  }
  #game-container {
    border: 2px solid #3d1a00;
    box-shadow: 0 0 40px #ff220044, 0 0 80px #ff110011;
    image-rendering: pixelated;
  }
  #footer {
    color: #3d1a00;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div id="header">◆ DEMAKE ENGINE v0.1 — WAVE SHOOTER TEMPLATE ◆</div>
<div id="game-container"></div>
<div id="footer">WASD / ARROWS — MOVE &nbsp;|&nbsp; MOUSE — AIM &amp; SHOOT &nbsp;|&nbsp; R — RELOAD</div>

<!-- Loading overlay shown while manifest fetches -->
<div id="loading-overlay" style="
  position:fixed; inset:0; background:#080400;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  font-family:'Courier New',monospace; color:#ff4400;
  z-index:999;
">
  <div style="font-size:13px; letter-spacing:4px; margin-bottom:16px;">LOADING DEMAKE...</div>
  <div id="load-msg" style="font-size:10px; color:#662200; letter-spacing:2px;">Fetching manifest</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<script>
// ============================================================
// MANIFEST LOADER — Sprint 4
// Reads ?id= and ?api= from URL, fetches real manifest from backend.
// Falls back to hardcoded test manifest if no id param present.
// ============================================================
const urlParams  = new URLSearchParams(window.location.search);
const DEMAKE_ID  = urlParams.get("id");
const API_BASE   = urlParams.get("api") || "http://localhost:8000";
// ?template=<id> boots any genre scene directly from fallback data (smoke testing)
const FORCE_TEMPLATE = urlParams.get("template");

const TEMPLATE_IDS = [
  "wave_shooter",
  "side_scroll_platformer",
  "top_down_action_rpg",
  "open_world_sandbox",
  "turn_based_rpg",
];

// Hardcoded fallback for testing game.html directly (no pipeline needed)
const FALLBACK_MANIFEST = {
  demake_id: "test-001",
  title: "ZOMBIE BUNKER",
  template: "wave_shooter",
  palette: {
    primary:    0x1a0a00,
    secondary:  0x3d2b1f,
    accent:     0x8b1a00,
    highlight:  0xff4400,
    background: 0x0d0500,
    floor:      0x1a0e06,
    wall:       0x0f0804,
    hud_text:   "#ff4400",
    hud_bg:     "#000000",
    hud_dim:    "#662200"
  },
  game_config: {
    physics:  { gravity: 0, player_speed: 130, bullet_speed: 380 },
    waves:    { start_count: 6, multiplier: 1.4, boss_every: 5, spawn_delay_ms: 700 },
    player:   { max_hp: 100, max_ammo: 30, reload_time_ms: 1800, fire_rate_ms: 150 },
    enemy:    { base_hp: 30, base_speed: 55, damage: 10, hp_scale: 1.2, speed_scale: 1.05 },
    boss:     { hp_mult: 8, speed_mult: 0.6, damage_mult: 3, size_mult: 2.0 }
  }
};

// Converts hex string palette from API to Phaser integer format
function normalizePalette(palette) {
  const toInt = v => {
    if (typeof v === "number") return v;
    const h = String(v).replace("#", "");
    return parseInt(h, 16);
  };
  return {
    primary:    toInt(palette.primary    || "#1a0a00"),
    secondary:  toInt(palette.secondary  || "#3d2b1f"),
    accent:     toInt(palette.accent     || "#8b1a00"),
    highlight:  toInt(palette.highlight  || "#ff4400"),
    background: toInt(palette.background || "#0d0500"),
    floor:      toInt(palette.primary    || "#1a0e06"),
    wall:       toInt(palette.secondary  || "#0f0804"),
    hud_text:   palette.hud_text  || "#ff4400",
    hud_bg:     palette.hud_bg    || "#000000",
    hud_dim:    palette.hud_dim   || "#662200",
  };
}

// Accepts int or '#hex' string — always returns an int
function hexColor(v, fallbackHex) {
  if (typeof v === 'number') return v;
  return parseInt((v || fallbackHex).replace('#', ''), 16);
}

let MANIFEST = null;

async function loadManifest() {
  const loadMsg = document.getElementById("load-msg");

  if (!DEMAKE_ID) {
    // No ID in URL — use fallback for direct testing
    loadMsg.textContent = "No ID found — loading test manifest";
    MANIFEST = FALLBACK_MANIFEST;
    applyTemplateOverride();
    startGame();
    return;
  }

  try {
    loadMsg.textContent = `Fetching manifest for ${DEMAKE_ID.slice(0, 8)}...`;
    const res = await fetch(`${API_BASE}/api/v1/demake/${DEMAKE_ID}/manifest`);

    if (!res.ok) {
      throw new Error(`API returned ${res.status}`);
    }

    const data = await res.json();
    data.palette = normalizePalette(data.palette || {});

    // Ensure game_config has required fields with fallbacks
    data.game_config = data.game_config || {};
    data.game_config.physics  = data.game_config.physics  || FALLBACK_MANIFEST.game_config.physics;
    data.game_config.waves    = data.game_config.waves    || FALLBACK_MANIFEST.game_config.waves;
    data.game_config.player   = data.game_config.player   || FALLBACK_MANIFEST.game_config.player;
    data.game_config.enemy    = data.game_config.enemy    || FALLBACK_MANIFEST.game_config.enemy;
    data.game_config.boss     = data.game_config.boss     || FALLBACK_MANIFEST.game_config.boss;

    MANIFEST = data;
    applyTemplateOverride();
    loadMsg.textContent = `Loaded: ${MANIFEST.title}`;
    startGame();

  } catch (err) {
    loadMsg.textContent = `Error: ${err.message} — using test manifest`;
    console.warn("Manifest fetch failed, using fallback:", err);
    MANIFEST = FALLBACK_MANIFEST;
    applyTemplateOverride();
    setTimeout(startGame, 1200);
  }
}

// ?template=<id> overrides the manifest's template for per-genre smoke testing.
// Also injects minimal genre-specific config so scenes don't crash on missing fields.
function applyTemplateOverride() {
  if (!FORCE_TEMPLATE) return;
  if (!TEMPLATE_IDS.includes(FORCE_TEMPLATE)) {
    console.warn(`[Smoke] Unknown template '${FORCE_TEMPLATE}' — ignoring`);
    return;
  }
  MANIFEST.template = FORCE_TEMPLATE;
  const gc = MANIFEST.game_config;
  gc.combat = gc.combat || { max_hp: 120, max_mp: 60, attack_damage: 25,
                             attack_range: 50, base_magic: 30 };
  gc.enemy  = gc.enemy  || { base_hp: 50, base_speed: 45, damage: 15,
                             hp_scale: 1.2, speed_scale: 1.05, base_attack: 15 };
  gc.world  = gc.world  || { wanted_max: 5, npc_count: 8 };
  gc.battle = gc.battle || { player_hp: 80, player_mp: 40, max_encounters: 5,
                             base_attack: 20, base_magic: 30, base_heal: 25 };
  console.log(`[Smoke] Template override → ${FORCE_TEMPLATE}`);
}

function startGame() {
  document.getElementById("loading-overlay").style.display = "none";
  const title = MANIFEST.title || "DEMAKE";
  document.getElementById("header").textContent = FORCE_TEMPLATE
    ? `◆ SMOKE TEST — ${FORCE_TEMPLATE} ◆`
    : `◆ ${title} ◆`;
  bootPhaser();
}

// Global constants used by Phaser scenes and generateTextures
// Declared as var so they're accessible across all functions
var W = 480, H = 320;
var TILE = 16;

// ============================================================
// TILEMAP RENDERER — Sprint 7
// Reads WFC-generated tilemap from manifest and renders it in Phaser
// Falls back to procedural if no tilemap in manifest
// ============================================================
class TilemapRenderer {
  constructor(scene) {
    this.scene   = scene;
    this.tilemap = MANIFEST?.tilemap || null;
    this.walls   = null;  // Physics static group for impassable tiles
    this.worldW  = W;
    this.worldH  = H;
  }

  /**
   * Build the level from WFC tilemap data.
   * Returns { walls, playerSpawn, enemySpawns, itemSpawns }
   */
  build() {
    if (!this.tilemap) {
      console.log("[Tilemap] No tilemap in manifest — using procedural fallback");
      return this._buildProcedural();
    }

    const { grid, tile_defs, width, height, tile_size, spawn_points } = this.tilemap;
    const tw = tile_size || TILE;
    const p  = MANIFEST.palette;

    // World size from tilemap
    this.worldW = width  * tw;
    this.worldH = height * tw;

    // Set world bounds
    this.scene.physics.world.setBounds(0, 0, this.worldW, this.worldH);
    this.scene.cameras.main.setBounds(0, 0, this.worldW, this.worldH);

    // Background
    const bgColor = typeof p.background === 'number' ? p.background
      : parseInt((p.background || '#0a0a0a').replace('#',''), 16);
    this.scene.add.rectangle(this.worldW/2, this.worldH/2,
      this.worldW, this.worldH, bgColor).setDepth(0);

    // Create wall group
    this.walls = this.scene.physics.add.staticGroup();

    // Render each tile
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const tileId  = grid[y]?.[x] || 'void';
        const tileDef = tile_defs[tileId];
        if (!tileDef || tileId === 'void') continue;

        // Skip spawn tiles — sprites are placed on them
        if (tileId === 'player' || tileId === 'enemy' || tileId === 'spawn') continue;

        const px = x * tw + tw/2;
        const py = y * tw + tw/2;

        // Parse tile color
        let color = 0x333333;
        try {
          color = parseInt((tileDef.color || '#333333').replace('#',''), 16);
        } catch(e) {}

        const isImpassable = !tileDef.passable;

        // Draw tile
        this.scene.add.rectangle(px, py, tw-1, tw-1, color, 0.9)
          .setDepth(isImpassable ? 2 : 1);

        // Wall bevel — lighter top/left edge so walls pop against floor
        if (isImpassable) {
          this.scene.add.rectangle(px, py - tw/2 + 1, tw-2, 2, 0xffffff, 0.15).setDepth(3);
          this.scene.add.rectangle(px - tw/2 + 1, py, 2, tw-2, 0xffffff, 0.1).setDepth(3);
        }

        // Add to physics if impassable
        if (isImpassable) {
          const physRect = this.scene.add.rectangle(px, py, tw, tw, color, 0)
            .setDepth(2);
          physRect.tileType = tileId;
          this.scene.physics.add.existing(physRect, true);
          this.walls.add(physRect);
        }

        // Special tile decorations
        if (tileId === 'torch' || tileId === 'ammo') {
          this.scene.add.rectangle(px, py, 4, 4, 0xffcc00).setDepth(3);
        }
        if (tileId === 'chest' || tileId === 'mission' || tileId === 'goal') {
          this.scene.add.text(px-4, py-5, '★',
            { fontSize: '8px', color: '#ffff00' }).setDepth(3);
        }
        if (tileId === 'gym') {
          this.scene.add.rectangle(px, py, tw-2, tw-2, 0xaa3333, 0.9).setDepth(3);
          this.scene.add.text(px-5, py-6, 'G',
            { fontSize: '10px', color: '#ffdddd',
              stroke: '#000000', strokeThickness: 2 }).setDepth(4);
        }
      }
    }

    // Resolve spawn points
    const [px, py] = Array.isArray(spawn_points?.player)
      ? spawn_points.player : [2, height/2|0];

    const playerSpawn = {
      x: px * tw + tw/2,
      y: py * tw + tw/2,
    };

    const enemySpawns = (spawn_points?.enemies || []).map(([ex, ey]) => ({
      x: ex * tw + tw/2,
      y: ey * tw + tw/2,
      tileType: grid[ey]?.[ex] || 'enemy',
    }));

    const itemSpawns = (spawn_points?.items || []).map(([ix, iy]) => ({
      x: ix * tw + tw/2,
      y: iy * tw + tw/2,
      tileType: grid[iy]?.[ix] || 'item',
    }));

    console.log(`[Tilemap] Built ${width}x${height} map | `+
      `player@(${px},${py}) | ${enemySpawns.length} enemies | ${itemSpawns.length} items`);

    return { walls: this.walls, playerSpawn, enemySpawns, itemSpawns, worldWidth: this.worldW, worldHeight: this.worldH };
  }

  /** Procedural fallback — used when no tilemap in manifest.
   *  Genre-aware so smoke tests resemble real WFC output (Sprint 8D feedback). */
  _buildProcedural() {
    const template = MANIFEST.template;
    if (template === 'open_world_sandbox')    return this._buildCity();
    if (template === 'top_down_action_rpg')   return this._buildDungeonRooms();
    if (template === 'turn_based_rpg')        return this._buildOverworld();
    return this._buildArena();
  }

  _addWallRect(x, y, w, h, color) {
    const wall = this.scene.add.rectangle(x + w/2, y + h/2, w, h, color).setDepth(2);
    this.scene.physics.add.existing(wall, true);
    wall.tileType = 'wall';
    this.walls.add(wall);
    // bevel for depth
    this.scene.add.rectangle(x + w/2, y + 1, w, 2, 0xffffff, 0.15).setDepth(3);
    return wall;
  }

  _pointClear(x, y, margin = 20) {
    let ok = true;
    this.walls.children.each(w => {
      if (x > w.x - w.width/2 - margin && x < w.x + w.width/2 + margin &&
          y > w.y - w.height/2 - margin && y < w.y + w.height/2 + margin) ok = false;
    });
    return ok;
  }

  _randomClearPoints(count, worldW, worldH, margin = 60) {
    const pts = [];
    let guard = 0;
    while (pts.length < count && guard++ < 200) {
      const x = Phaser.Math.Between(margin, worldW - margin);
      const y = Phaser.Math.Between(margin, worldH - margin);
      if (this._pointClear(x, y)) pts.push({ x, y });
    }
    return pts;
  }

  // City blocks separated by roads — GTA-style fallback
  _buildCity() {
    const p = MANIFEST.palette;
    const bgColor  = hexColor(p.background, '#0a0a0a');
    const bldColor = hexColor(p.secondary,  '#4a4a5a');
    const roadColor = hexColor(p.primary,   '#2a2a2a');

    this.worldW = 640; this.worldH = 480;
    this.scene.physics.world.setBounds(0, 0, this.worldW, this.worldH);
    this.scene.cameras.main.setBounds(0, 0, this.worldW, this.worldH);
    this.scene.add.rectangle(this.worldW/2, this.worldH/2, this.worldW, this.worldH, bgColor).setDepth(0);
    this.walls = this.scene.physics.add.staticGroup();

    // Road grid (lighter bands)
    for (let i = 0; i <= 4; i++) {
      this.scene.add.rectangle(32 + i * 144, this.worldH/2, 24, this.worldH, roadColor, 0.35).setDepth(1);
    }
    for (let i = 0; i <= 3; i++) {
      this.scene.add.rectangle(this.worldW/2, 32 + i * 144, this.worldW, 24, roadColor, 0.35).setDepth(1);
    }

    // Buildings: one per block with random inset
    for (let bx = 0; bx < 4; bx++) {
      for (let by = 0; by < 3; by++) {
        const x0 = 56 + bx * 144, y0 = 56 + by * 144;
        const bw = Phaser.Math.Between(70, 104);
        const bh = Phaser.Math.Between(60, 96);
        const wx = x0 + Phaser.Math.Between(0, 120 - bw);
        const wy = y0 + Phaser.Math.Between(0, 120 - bh);
        this._addWallRect(wx, wy, bw, bh, bldColor);
      }
    }

    // Border walls
    this._addWallRect(0, 0, this.worldW, 16, bldColor);
    this._addWallRect(0, this.worldH - 16, this.worldW, 16, bldColor);
    this._addWallRect(0, 0, 16, this.worldH, bldColor);
    this._addWallRect(this.worldW - 16, 0, 16, this.worldH, bldColor);

    const playerSpawn = { x: this.worldW/2, y: this.worldH/2 };
    const enemySpawns = this._randomClearPoints(8, this.worldW, this.worldH)
      .map(pt => ({ ...pt, tileType: 'npc' }));
    console.log(`[Tilemap] City fallback: ${this.worldW}x${this.worldH}, ` +
      `${this.walls.countActive(true)} structures, ${enemySpawns.length} NPC spawns`);
    return { walls: this.walls, playerSpawn, enemySpawns, itemSpawns: [],
             worldWidth: this.worldW, worldHeight: this.worldH };
  }

  // Interior walls / pillars — dungeon-room fallback for ARPG
  _buildDungeonRooms() {
    const p = MANIFEST.palette;
    const bgColor = hexColor(p.background, '#0a0a1a');
    const wallColor = hexColor(p.secondary, '#160a16');

    this.worldW = 512; this.worldH = 384;
    this.scene.physics.world.setBounds(0, 0, this.worldW, this.worldH);
    this.scene.cameras.main.setBounds(0, 0, this.worldW, this.worldH);
    this.scene.add.rectangle(this.worldW/2, this.worldH/2, this.worldW, this.worldH, bgColor).setDepth(0);
    this.walls = this.scene.physics.add.staticGroup();

    // Room divider with a doorway gap, plus random pillars
    const midY = this.worldH/2;
    this._addWallRect(0, midY - 8, this.worldW/2 - 40, 16, wallColor);
    this._addWallRect(this.worldW/2 + 40, midY - 8, this.worldW/2 - 40, 16, wallColor);
    const midX = this.worldW/2;
    this._addWallRect(midX - 8, 0, 16, this.worldH/2 - 40, wallColor);
    this._addWallRect(midX - 8, this.worldH/2 + 40, 16, this.worldH/2 - 40, wallColor);
    for (let i = 0; i < 6; i++) {
      const x = Phaser.Math.Between(60, this.worldW - 100);
      const y = Phaser.Math.Between(60, this.worldH - 100);
      if (this._pointClear(x, y, 50)) this._addWallRect(x, y, 32, 32, wallColor);
    }

    // Border walls
    this._addWallRect(0, 0, this.worldW, 16, wallColor);
    this._addWallRect(0, this.worldH - 16, this.worldW, 16, wallColor);
    this._addWallRect(0, 0, 16, this.worldH, wallColor);
    this._addWallRect(this.worldW - 16, 0, 16, this.worldH, wallColor);

    const playerSpawn = { x: this.worldW/4, y: this.worldH/4 };
    const enemySpawns = this._randomClearPoints(5, this.worldW, this.worldH)
      .map(pt => ({ ...pt, tileType: 'enemy' }));
    console.log(`[Tilemap] Dungeon fallback: ${this.worldW}x${this.worldH}, ` +
      `${this.walls.countActive(true)} walls, ${enemySpawns.length} enemy spawns`);
    return { walls: this.walls, playerSpawn, enemySpawns, itemSpawns: [],
             worldWidth: this.worldW, worldHeight: this.worldH };
  }

  // Overworld route — grass, tall-grass encounter patches, trees, town → gym path
  _buildOverworld() {
    const p = MANIFEST.palette;
    const grassCol = hexColor(p.primary,   '#2a6a2a');
    const tallCol  = hexColor(p.secondary, '#3a8a3a');
    const treeCol  = hexColor(p.accent,    '#1a4a1a');
    const pathCol  = hexColor(p.highlight, '#8b6914');
    const townCol  = 0xcc8844;

    this.worldW = 480; this.worldH = 360;
    this.scene.physics.world.setBounds(0, 0, this.worldW, this.worldH);
    this.scene.cameras.main.setBounds(0, 0, this.worldW, this.worldH);
    this.scene.add.rectangle(this.worldW/2, this.worldH/2, this.worldW, this.worldH, grassCol).setDepth(0);
    this.walls = this.scene.physics.add.staticGroup();

    // Path: town (top-left) → gym (bottom-right)
    this.scene.add.rectangle(this.worldW*0.35, 48, this.worldW*0.7, 18, pathCol, 0.8).setDepth(1);
    this.scene.add.rectangle(this.worldW - 56, 48 + (this.worldH - 130)/2, 18, this.worldH - 130, pathCol, 0.8).setDepth(1);
    this.scene.add.rectangle(this.worldW*0.5, this.worldH - 40, this.worldW - 112, 18, pathCol, 0.8).setDepth(1);

    // Town buildings near spawn
    this._addWallRect(24, 20, 40, 32, townCol);
    this._addWallRect(76, 24, 30, 28, townCol);

    // Tree clusters (impassable)
    for (let i = 0; i < 9; i++) {
      const tx = Phaser.Math.Between(40, this.worldW - 60);
      const ty = Phaser.Math.Between(40, this.worldH - 60);
      const n = Phaser.Math.Between(1, 3);
      for (let j = 0; j < n; j++) {
        this._addWallRect(tx + j*18, ty + (j % 2)*18, 16, 16, treeCol);
      }
    }

    // Tall-grass encounter patches (returned as enemy spawn zones)
    const enemySpawns = [];
    for (let i = 0; i < 5; i++) {
      const px = Phaser.Math.Between(60, this.worldW - 110);
      const py = Phaser.Math.Between(60, this.worldH - 90);
      this.scene.add.rectangle(px, py, 48, 32, tallCol, 0.95).setDepth(1);
      for (let gx = 0; gx < 3; gx++) for (let gy = 0; gy < 2; gy++) {
        this.scene.add.rectangle(px - 16 + gx*16, py - 8 + gy*16, 12, 2, treeCol, 0.35).setDepth(2);
      }
      enemySpawns.push({ x: px, y: py, tileType: 'tall_grass' });
    }

    // Border trees
    this._addWallRect(0, 0, this.worldW, 12, treeCol);
    this._addWallRect(0, this.worldH - 12, this.worldW, 12, treeCol);
    this._addWallRect(0, 0, 12, this.worldH, treeCol);
    this._addWallRect(this.worldW - 12, 0, 12, this.worldH, treeCol);

    const playerSpawn = { x: 40, y: 76 };
    console.log(`[Tilemap] Overworld fallback: ${this.worldW}x${this.worldH}, ` +
      `${enemySpawns.length} grass patches`);
    return { walls: this.walls, playerSpawn, enemySpawns, itemSpawns: [],
             worldWidth: this.worldW, worldHeight: this.worldH };
  }

  // Original border arena — wave shooter, platformer fallback
  _buildArena() {
    const p = MANIFEST.palette;
    const bgColor = typeof p.background === 'number' ? p.background
      : parseInt((p.background||'#0a0a0a').replace('#',''),16);

    this.worldW = W;
    this.worldH = H;
    this.scene.physics.world.setBounds(0, 0, W, H);
    this.scene.cameras.main.setBounds(0, 0, W, H);
    this.scene.add.rectangle(W/2, H/2, W, H, bgColor).setDepth(0);
    this.walls = this.scene.physics.add.staticGroup();

    const wc = hexColor(p.secondary, '#2a2a3a');
    this._addWallRect(0, 0, W, 16, wc);
    this._addWallRect(0, H - 16, W, 16, wc);
    this._addWallRect(0, 0, 16, H, wc);
    this._addWallRect(W - 16, 0, 16, H, wc);

    return {
      walls: this.walls,
      playerSpawn:  { x: W/4,     y: H/2 },
      enemySpawns:  [
        { x: W*3/4, y: H/2 },
        { x: W/2,   y: H/4 },
        { x: W/2,   y: H*3/4 },
      ],
      itemSpawns: [],
      worldWidth: W, worldHeight: H,
    };
  }

  get width()  { return this.worldW; }
  get height() { return this.worldH; }
}

// ============================================================
// SHARED GAME SYSTEMS — Sprint 8A
// Entity damage helpers, Inventory, ProjectileSystem.
// One home for combat plumbing reused across template scenes.
// ============================================================
const SharedSystems = {

  // Apply damage to any active sprite carrying .hp.
  // Handles red flash + blood particles. Returns true if the hit was lethal.
  applyDamage(scene, target, amount, opts = {}) {
    if (!target || !target.active) return false;
    target.hp = (target.hp ?? target.maxHp ?? 0) - amount;

    target.setTint(opts.tint ?? 0xff0000);
    scene.time.delayedCall(opts.flashMs ?? 100, () => {
      if (target.active) target.clearTint();
    });

    if (opts.particles !== false && scene.textures.exists('blood')) {
      for (let i = 0; i < 4; i++) {
        const bp = scene.add.image(
          target.x + Phaser.Math.Between(-4, 4),
          target.y + Phaser.Math.Between(-4, 4),
          'blood'
        ).setDepth(6).setAlpha(0.9);
        scene.time.delayedCall(300 + i * 50, () => bp.destroy());
      }
    }
    return target.hp <= 0;
  },

  // Floating combat text ("+40 HP", "+ POTION") that drifts up and fades
  floatText(scene, x, y, msg, color = '#ffffff') {
    const t = scene.add.text(x - 10, y - 18, msg,
      { fontSize: '9px', fontFamily: 'Courier New', color,
        stroke: '#000000', strokeThickness: 2 }).setDepth(20);
    scene.tweens.add({ targets: t, y: y - 36, alpha: 0, duration: 900,
      onComplete: () => t.destroy() });
  }
};

// Slot-based item store. Emits nothing itself — owning scene emits
// 'inventoryChanged' so any HUD can subscribe.
class Inventory {
  constructor(maxSlots = 6) {
    this.items     = {};   // itemId -> count
    this.maxSlots  = maxSlots;
    this.usedSlots = 0;
  }

  add(itemId, count = 1) {
    for (let i = 0; i < count; i++) {
      if (this.usedSlots >= this.maxSlots && !(itemId in this.items)) return false;
      if (!(itemId in this.items)) { this.items[itemId] = 0; this.usedSlots++; }
      this.items[itemId]++;
    }
    return true;
  }

  remove(itemId, count = 1) {
    if (!this.has(itemId, count)) return false;
    this.items[itemId] -= count;
    if (this.items[itemId] <= 0) { delete this.items[itemId]; this.usedSlots--; }
    return true;
  }

  has(itemId, count = 1) { return (this.items[itemId] || 0) >= count; }
  count(itemId)          { return this.items[itemId] || 0; }
}

// Generic projectile pool usable by any scene/shooter.
// Projectiles carry .damage, auto-expire via TTL and die on wall contact.
class ProjectileSystem {
  constructor(scene, texture = 'bullet', wallsGroup = null) {
    this.scene   = scene;
    this.texture = texture;
    this.group   = scene.physics.add.group();
    if (wallsGroup) this.collideWithWalls(wallsGroup);
  }

  collideWithWalls(wallsGroup) {
    this.scene.physics.add.collider(this.group, wallsGroup, (proj) => proj.destroy());
  }

  // opts: { texture, damage, tint, ttlMs (0 = never expire), gravity }
  fire(x, y, angleRad, speed, opts = {}) {
    const tex  = opts.texture || this.texture;
    const proj = this.group.create(x, y, tex);
    proj.setDepth(8);
    proj.setRotation(angleRad);
    if (opts.tint) proj.setTint(opts.tint);
    this.scene.physics.velocityFromAngle(
      Phaser.Math.RadToDeg(angleRad), speed, proj.body.velocity
    );
    proj.body.setAllowGravity(opts.gravity === true);
    proj.damage = opts.damage ?? 25;
    if (opts.ttlMs !== 0) {
      this.scene.time.delayedCall(opts.ttlMs ?? 3000, () => {
        if (proj.active) proj.destroy();
      });
    }
    return proj;
  }
}

// Shared procedural textures (bolt, potion) appended to the standard set
function initSharedTextures(scene) {
  if (!scene.textures.exists('bolt')) {
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0x8844ff); g.fillCircle(4, 4, 3);
    g.fillStyle(0xddbbff); g.fillCircle(4, 4, 1.5);
    g.generateTexture('bolt', 8, 8);
    g.destroy();
  }
  if (!scene.textures.exists('potion')) {
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xcc2222); g.fillRect(2, 4, 6, 7);
    g.fillStyle(0x885544); g.fillRect(3, 1, 4, 3);
    g.fillStyle(0xff8888); g.fillRect(3, 6, 2, 3);
    g.generateTexture('potion', 10, 12);
    g.destroy();
  }
}

// ============================================================
// PROCEDURAL PIXEL ART — drawn to canvas, used as textures
// Sprint 3 will replace these with SD-generated spritesheets
// ============================================================
function generateTextures(scene, useRealSprites = {}) {
  const p = MANIFEST.palette;

  // Floor tile — concrete grate pattern
  const floorGfx = scene.make.graphics({ x: 0, y: 0, add: false });
  floorGfx.fillStyle(p.floor);
  floorGfx.fillRect(0, 0, TILE, TILE);
  floorGfx.lineStyle(1, 0x0a0604, 0.8);
  floorGfx.strokeRect(0, 0, TILE, TILE);
  floorGfx.fillStyle(0x140a04, 0.5);
  floorGfx.fillRect(1, 1, 6, 6);
  floorGfx.fillRect(9, 9, 6, 6);
  floorGfx.generateTexture('tile_floor', TILE, TILE);
  floorGfx.destroy();

  // Wall tile — brick pattern
  const wallGfx = scene.make.graphics({ x: 0, y: 0, add: false });
  wallGfx.fillStyle(p.wall);
  wallGfx.fillRect(0, 0, TILE, TILE);
  wallGfx.lineStyle(1, 0x050302, 1);
  wallGfx.strokeRect(0, 0, TILE, TILE);
  // Brick lines
  wallGfx.fillStyle(0x080503, 1);
  wallGfx.fillRect(0, 7, TILE, 2);
  wallGfx.fillRect(8, 0, 2, 7);
  wallGfx.fillRect(4, 9, 2, 7);
  wallGfx.generateTexture('tile_wall', TILE, TILE);
  wallGfx.destroy();

  // Player — skip if real sprite was loaded from manifest
  if (!useRealSprites['player']) {
  // Spritesheet: 8 frames × 16px = 128px wide
  // frames 0-1: idle, 2-5: walk, 6-7: shoot
  const FRAMES = 8;
  const playerGfx = scene.make.graphics({ x: 0, y: 0, add: false });
  for (let f = 0; f < FRAMES; f++) {
    const ox = f * TILE;
    const bob = (f >= 2 && f <= 5) ? (f % 2 === 0 ? 0 : 1) : 0;  // walk bob
    const isShooting = f >= 6;

    // Body
    playerGfx.fillStyle(0x4a6b3a); // military green
    playerGfx.fillRect(ox + 4, 6 + bob, 8, 7);
    // Head + helmet
    playerGfx.fillStyle(0x3a5a2a);
    playerGfx.fillRect(ox + 5, 2 + bob, 6, 5);
    // Visor
    playerGfx.fillStyle(0x88ccff);
    playerGfx.fillRect(ox + 6, 4 + bob, 4, 2);
    // Legs
    playerGfx.fillStyle(0x2a3a20);
    playerGfx.fillRect(ox + 4, 13 + bob, 3, 3);
    playerGfx.fillRect(ox + 8, 13 + bob, 3, 3);
    // Gun (extended when shooting)
    playerGfx.fillStyle(0x222222);
    if (isShooting) {
      playerGfx.fillRect(ox + 10, 7 + bob, 5, 2);
    } else {
      playerGfx.fillRect(ox + 10, 8 + bob, 4, 2);
    }
  }
  playerGfx.generateTexture('player', TILE * FRAMES, TILE);
  playerGfx.destroy();
  // Register frames so generateFrameNumbers works
  const playerTex = scene.textures.get('player');
  for (let i = 0; i < FRAMES; i++) {
    playerTex.add(i, 0, i * TILE, 0, TILE, TILE);
  }
  } // end if !useRealSprites['player']

  // Enemy — skip if real sprite loaded
  if (!useRealSprites['enemy']) {
  const enemyGfx = scene.make.graphics({ x: 0, y: 0, add: false });
  for (let f = 0; f < 4; f++) {
    const ox = f * TILE;
    const lurch = f % 2 === 0 ? 0 : 1;
    // Body — rotting green
    enemyGfx.fillStyle(0x4a6b2a);
    enemyGfx.fillRect(ox + 4, 7 + lurch, 8, 6);
    // Head
    enemyGfx.fillStyle(0x6a8a3a);
    enemyGfx.fillRect(ox + 5, 2 + lurch, 6, 6);
    // Red eyes
    enemyGfx.fillStyle(0xff0000);
    enemyGfx.fillRect(ox + 6, 4 + lurch, 2, 2);
    enemyGfx.fillRect(ox + 9, 4 + lurch, 2, 2);
    // Arms — outstretched
    const armReach = f % 2 === 0 ? 2 : 3;
    enemyGfx.fillStyle(0x4a6b2a);
    enemyGfx.fillRect(ox + 1, 8 + lurch, armReach, 2);
    enemyGfx.fillRect(ox + 13, 8 + lurch, armReach, 2);
    // Legs
    enemyGfx.fillStyle(0x2a4a1a);
    enemyGfx.fillRect(ox + 4, 13 + lurch, 3, 3);
    enemyGfx.fillRect(ox + 8, 13 - lurch, 3, 3);
  }
  enemyGfx.generateTexture('enemy', TILE * 4, TILE);
  enemyGfx.destroy();
  const enemyTex = scene.textures.get('enemy');
  for (let i = 0; i < 4; i++) {
    enemyTex.add(i, 0, i * TILE, 0, TILE, TILE);
  }
  } // end if !useRealSprites['enemy']

  // Boss — skip if real sprite loaded
  if (!useRealSprites['boss']) {
  const BOSS_SIZE = 32;
  const bossGfx = scene.make.graphics({ x: 0, y: 0, add: false });
  for (let f = 0; f < 2; f++) {
    const ox = f * BOSS_SIZE;
    const sway = f === 0 ? 0 : 2;
    // Huge body
    bossGfx.fillStyle(0x2a4a1a);
    bossGfx.fillRect(ox + 6, 12 + sway, 20, 16);
    // Head — massive
    bossGfx.fillStyle(0x3a5a1a);
    bossGfx.fillRect(ox + 4, 2 + sway, 24, 12);
    // Glowing eyes
    bossGfx.fillStyle(0xff6600);
    bossGfx.fillRect(ox + 7, 6 + sway, 5, 4);
    bossGfx.fillRect(ox + 20, 6 + sway, 5, 4);
    // Chains
    bossGfx.fillStyle(0x888888);
    bossGfx.fillRect(ox + 8, 14 + sway, 2, 8);
    bossGfx.fillRect(ox + 22, 14 + sway, 2, 8);
    // Giant fists
    bossGfx.fillStyle(0x2a3a10);
    bossGfx.fillRect(ox + 0, 16 + sway, 6, 8);
    bossGfx.fillRect(ox + 26, 16 + sway, 6, 8);
    // Legs
    bossGfx.fillRect(ox + 8, 26 + sway, 6, 6);
    bossGfx.fillRect(ox + 18, 26 - sway, 6, 6);
  }
  bossGfx.generateTexture('boss', BOSS_SIZE * 2, BOSS_SIZE);
  bossGfx.destroy();
  const bossTex = scene.textures.get('boss');
  for (let i = 0; i < 2; i++) {
    bossTex.add(i, 0, i * BOSS_SIZE, 0, BOSS_SIZE, BOSS_SIZE);
  }
  } // end if !useRealSprites['boss']

  // Bullet, blood, flash — always procedural (not in manifest)
  if (!scene.textures.exists('bullet')) {
    const bulletGfx = scene.make.graphics({ x: 0, y: 0, add: false });
    bulletGfx.fillStyle(0xffcc00);
    bulletGfx.fillRect(0, 1, 6, 2);
    bulletGfx.fillStyle(0xffffff);
    bulletGfx.fillRect(0, 1, 2, 2);
    bulletGfx.generateTexture('bullet', 6, 4);
    bulletGfx.destroy();
  }

  if (!scene.textures.exists('blood')) {
    const bloodGfx = scene.make.graphics({ x: 0, y: 0, add: false });
    bloodGfx.fillStyle(0xaa0000);
    bloodGfx.fillRect(0, 0, 4, 4);
    bloodGfx.generateTexture('blood', 4, 4);
    bloodGfx.destroy();
  }

  if (!scene.textures.exists('flash')) {
    const flashGfx = scene.make.graphics({ x: 0, y: 0, add: false });
    flashGfx.fillStyle(0xffff00);
    flashGfx.fillRect(0, 0, 6, 6);
    flashGfx.fillStyle(0xffffff);
    flashGfx.fillRect(2, 2, 2, 2);
    flashGfx.generateTexture('flash', 6, 6);
    flashGfx.destroy();
  }

  // Floor and wall tiles — use real if available
  if (!useRealSprites['tile_floor'] && !scene.textures.exists('tile_floor')) {
    const floorGfx = scene.make.graphics({ x: 0, y: 0, add: false });
    floorGfx.fillStyle(p.floor || 0x1a0e06);
    floorGfx.fillRect(0, 0, TILE, TILE);
    floorGfx.lineStyle(1, 0x0a0604, 0.8);
    floorGfx.strokeRect(0, 0, TILE, TILE);
    floorGfx.generateTexture('tile_floor', TILE, TILE);
    floorGfx.destroy();
  }

  if (!useRealSprites['tile_wall'] && !scene.textures.exists('tile_wall')) {
    const wallGfx = scene.make.graphics({ x: 0, y: 0, add: false });
    wallGfx.fillStyle(p.wall || 0x0f0804);
    wallGfx.fillRect(0, 0, TILE, TILE);
    wallGfx.lineStyle(1, 0x050302, 1);
    wallGfx.strokeRect(0, 0, TILE, TILE);
    wallGfx.fillStyle(0x080503, 1);
    wallGfx.fillRect(0, 7, TILE, 2);
    wallGfx.fillRect(8, 0, 2, 7);
    wallGfx.fillRect(4, 9, 2, 7);
    wallGfx.generateTexture('tile_wall', TILE, TILE);
    wallGfx.destroy();
  }

  // Sprint 8A shared textures
  initSharedTextures(scene);
}

// ============================================================
// PRELOAD SCENE
// ============================================================
class PreloadScene extends Phaser.Scene {
  constructor() { super('PreloadScene'); }

  preload() {
    const sprites = MANIFEST?.assets?.sprites || {};
    this._useRealSprites = {};

    // Frame configs must match what sprite_gen.py actually generates
    this._slotConfig = {
      player:     { frames: 8, frameW: 16, totalW: 128, h: 16 },
      enemy:      { frames: 4, frameW: 16, totalW: 64,  h: 16 },
      boss:       { frames: 2, frameW: 32, totalW: 64,  h: 32 },
      projectile: { frames: 2, frameW: 8,  totalW: 32,  h: 8  },
      tile_floor: { frames: 1, frameW: 16, totalW: 16,  h: 16 },
      tile_wall:  { frames: 1, frameW: 16, totalW: 16,  h: 16 },
    };

    for (const [slot, cfg] of Object.entries(this._slotConfig)) {
      const url = sprites[`sprite_${slot}`] || sprites[slot];
      if (url && url !== 'null' && url !== null) {
        // Load as spritesheet with correct frame dimensions
        this.load.spritesheet(slot, url, {
          frameWidth:  cfg.frameW,
          frameHeight: cfg.h,
        });
        this._useRealSprites[slot] = true;
        console.log(`[Preload] Loading real sprite: ${slot} from ${url}`);
      } else {
        this._useRealSprites[slot] = false;
      }
    }
  }

  create() {
    // For any real sprites loaded, verify frame 0 exists
    // If not (SD generated a single image not a sheet), fall back to procedural
    for (const [slot, useReal] of Object.entries(this._useRealSprites)) {
      if (!useReal) continue;
      const tex = this.textures.get(slot);
      if (!tex || !tex.has(0)) {
        console.warn(`[Preload] ${slot} has no frame 0 — falling back to procedural`);
        this._useRealSprites[slot] = false;
      }
    }

    generateTextures(this, this._useRealSprites);

    // Register wave shooter animations (only if frames exist)
    this._registerAnims();

    // Route to correct scene
    const template = MANIFEST?.template || 'wave_shooter';
    const SCENE_ROUTES = {
      wave_shooter:           'GameScene',
      side_scroll_platformer: 'PlatformerScene',
      top_down_action_rpg:    'TopDownRPGScene',
      open_world_sandbox:     'OpenWorldScene',
      turn_based_rpg:         'TurnOverworldScene',
    };
    this.scene.start(SCENE_ROUTES[template] || 'GameScene');
  }

  _registerAnims() {
    const animDefs = [
      { key: 'player_idle',  tex: 'player', frames: [0,1],       fps: 4,  loop: true  },
      { key: 'player_walk',  tex: 'player', frames: [2,3,4,5],   fps: 8,  loop: true  },
      { key: 'player_shoot', tex: 'player', frames: [6,7],        fps: 12, loop: false },
      { key: 'enemy_walk',   tex: 'enemy',  frames: [0,1,2,3],   fps: 6,  loop: true  },
      { key: 'boss_idle',    tex: 'boss',   frames: [0,1],        fps: 3,  loop: true  },
    ];

    for (const def of animDefs) {
      if (this.anims.exists(def.key)) continue;
      const tex = this.textures.get(def.tex);
      // Only create anim if all required frames exist
      const allFramesExist = def.frames.every(f => tex && tex.has(f));
      if (!allFramesExist) continue;
      this.anims.create({
        key:       def.key,
        frames:    this.anims.generateFrameNumbers(def.tex, { frames: def.frames }),
        frameRate: def.fps,
        repeat:    def.loop ? -1 : 0,
      });
    }
  }
}

// ============================================================
// GAME SCENE — Wave Shooter Template
// ============================================================
class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    const cfg = MANIFEST.game_config;
    const p   = MANIFEST.palette;

    // ── State ──────────────────────────────────────────────
    this.waveNum    = 1;
    this.score      = 0;
    this.isReloading = false;
    this.lastFired  = 0;
    this.reloadTimer = null;
    this.waveActive = false;
    this.enemiesLeft = 0;
    this.bossAlive  = false;
    this.gameOver   = false;
    this.ammo       = cfg.player.max_ammo;
    this.hp         = cfg.player.max_hp;

    // ── World — TilemapRenderer ────────────────────────────
    const tileRenderer = new TilemapRenderer(this);
    const { walls, playerSpawn, enemySpawns: tileEnemySpawns,
            itemSpawns, worldWidth, worldHeight } = tileRenderer.build();
    this.walls       = walls;
    this.tileEnemySpawns = tileEnemySpawns;
    this.worldW      = worldWidth;
    this.worldH      = worldHeight;

    // ── Groups ─────────────────────────────────────────────
    this.projectiles = new ProjectileSystem(this, 'bullet', walls);  // Sprint 8A
    this.enemies  = this.physics.add.group();
    this.particles = this.add.group();

    // ── Player ─────────────────────────────────────────────
    this.player = this.physics.add.sprite(playerSpawn.x, playerSpawn.y, 'player');
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(10, 10);
    this.player.setDepth(10);

    // Player animations — guarded so PreloadScene registrations aren't duplicated
    if (!this.anims.exists('player_idle'))
      this.anims.create({ key: 'player_idle', frames: this.anims.generateFrameNumbers('player', { start: 0, end: 1 }), frameRate: 4, repeat: -1 });
    if (!this.anims.exists('player_walk'))
      this.anims.create({ key: 'player_walk', frames: this.anims.generateFrameNumbers('player', { start: 2, end: 5 }), frameRate: 8, repeat: -1 });
    if (!this.anims.exists('player_shoot'))
      this.anims.create({ key: 'player_shoot', frames: this.anims.generateFrameNumbers('player', { start: 6, end: 7 }), frameRate: 12, repeat: 0 });
    if (!this.anims.exists('enemy_walk'))
      this.anims.create({ key: 'enemy_walk', frames: this.anims.generateFrameNumbers('enemy', { start: 0, end: 3 }), frameRate: 6, repeat: -1 });
    if (!this.anims.exists('boss_idle'))
      this.anims.create({ key: 'boss_idle', frames: this.anims.generateFrameNumbers('boss', { start: 0, end: 1 }), frameRate: 3, repeat: -1 });

    this.player.play('player_idle');

    // ── Wall collision ──────────────────────────────────────
    this.physics.add.collider(this.player, this.walls);

    // ── Input ──────────────────────────────────────────────
    this.keys = this.input.keyboard.addKeys({
      up:     Phaser.Input.Keyboard.KeyCodes.W,
      down:   Phaser.Input.Keyboard.KeyCodes.S,
      left:   Phaser.Input.Keyboard.KeyCodes.A,
      right:  Phaser.Input.Keyboard.KeyCodes.D,
      up2:    Phaser.Input.Keyboard.KeyCodes.UP,
      down2:  Phaser.Input.Keyboard.KeyCodes.DOWN,
      left2:  Phaser.Input.Keyboard.KeyCodes.LEFT,
      right2: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      reload: Phaser.Input.Keyboard.KeyCodes.R
    });

    this.input.on('pointerdown', (ptr) => {
      if (!this.gameOver) this.tryShoot(ptr.worldX, ptr.worldY);
    });

    // ── Collisions ─────────────────────────────────────────
    this.physics.add.overlap(this.projectiles.group, this.enemies, this.hitEnemy, null, this);
    this.physics.add.overlap(this.player,  this.enemies, this.enemyTouchPlayer, null, this);

    // ── HUD Scene ──────────────────────────────────────────
    this.scene.launch('HUDScene', { gameScene: this });

    // ── Kick off first wave ─────────────────────────────────
    this.time.delayedCall(1200, () => this.startWave());
  }

  // ── WAVE SYSTEM ────────────────────────────────────────────
  startWave() {
    const cfg = MANIFEST.game_config;
    const isBossWave = this.waveNum % cfg.waves.boss_every === 0;
    const count = Math.floor(cfg.waves.start_count * Math.pow(cfg.waves.multiplier, this.waveNum - 1));

    this.waveActive  = true;
    this.enemiesLeft = isBossWave ? count + 1 : count;

    // Notify HUD
    this.events.emit('waveStart', this.waveNum, isBossWave);

    // Spawn enemies in waves
    let spawned = 0;
    const spawnLoop = this.time.addEvent({
      delay: cfg.waves.spawn_delay_ms,
      repeat: count - 1,
      callback: () => {
        this.spawnEnemy(false);
        spawned++;
        if (spawned === count && isBossWave) {
          this.time.delayedCall(1500, () => this.spawnEnemy(true));
        }
      }
    });
  }

  spawnEnemy(isBoss) {
    const cfg = MANIFEST.game_config;
    const waveScale = this.waveNum;

    // Pick from tilemap spawn points, or fall back to random edges
    const spawn = this.tileEnemySpawns && this.tileEnemySpawns.length > 0
      ? Phaser.Utils.Array.GetRandom(this.tileEnemySpawns)
      : Phaser.Utils.Array.GetRandom([
          { x: Phaser.Math.Between(TILE * 2, this.worldW - TILE * 2), y: TILE * 2 },
          { x: Phaser.Math.Between(TILE * 2, this.worldW - TILE * 2), y: this.worldH - TILE * 2 },
          { x: TILE * 2,     y: Phaser.Math.Between(TILE * 2, this.worldH - TILE * 2) },
          { x: this.worldW - TILE * 2, y: Phaser.Math.Between(TILE * 2, this.worldH - TILE * 2) }
        ]);

    let enemy;
    if (isBoss) {
      enemy = this.enemies.create(spawn.x, spawn.y, 'boss');
      enemy.setFrame(0);
      enemy.setScale(1);
      enemy.isBoss = true;
      enemy.hp = Math.floor(cfg.enemy.base_hp * cfg.boss.hp_mult * Math.pow(cfg.enemy.hp_scale, waveScale));
      enemy.maxHp = enemy.hp;
      enemy.speed = cfg.enemy.base_speed * cfg.boss.speed_mult;
      enemy.damage = cfg.enemy.damage * cfg.boss.damage_mult;
      enemy.body.setSize(28, 28);
      if (this.anims.exists('boss_idle')) enemy.play('boss_idle');
      this.bossAlive = true;
      this.cameras.main.shake(300, 0.01);
    } else {
      enemy = this.enemies.create(spawn.x, spawn.y, 'enemy');
      enemy.setFrame(0);
      enemy.isBoss = false;
      enemy.hp = Math.floor(cfg.enemy.base_hp * Math.pow(cfg.enemy.hp_scale, waveScale - 1));
      enemy.maxHp = enemy.hp;
      enemy.speed = cfg.enemy.base_speed * Math.pow(cfg.enemy.speed_scale, waveScale - 1);
      enemy.damage = cfg.enemy.damage;
      enemy.body.setSize(12, 12);
      if (this.anims.exists('enemy_walk')) enemy.play('enemy_walk');
    }

    enemy.setDepth(5);
    enemy.lastDamageTime = 0;
    return enemy;
  }

  // ── COMBAT ─────────────────────────────────────────────────
  tryShoot(targetX, targetY) {
    const cfg = MANIFEST.game_config;
    const now = this.time.now;

    if (this.isReloading) return;
    if (this.ammo <= 0) { this.startReload(); return; }
    if (now - this.lastFired < cfg.player.fire_rate_ms) return;

    this.lastFired = now;
    this.ammo--;
    this.events.emit('ammoChanged', this.ammo);

    const px = this.player.x;
    const py = this.player.y;
    const angle = Phaser.Math.Angle.Between(px, py, targetX, targetY);

    this.projectiles.fire(px, py, angle, cfg.physics.bullet_speed, { damage: 25 });

    // Muzzle flash
    const flash = this.add.image(
      px + Math.cos(angle) * 14,
      py + Math.sin(angle) * 14,
      'flash'
    ).setDepth(12);
    this.time.delayedCall(60, () => flash.destroy());

    // Auto-reload on empty
    if (this.ammo === 0) {
      this.time.delayedCall(200, () => this.startReload());
    }

    // Play shoot anim briefly
    if (this.anims.exists('player_shoot')) this.player.play('player_shoot', true);
    this.time.delayedCall(200, () => {
      if (!this.gameOver && this.anims.exists('player_idle')) this.player.play('player_idle', true);
    });
  }

  startReload() {
    if (this.isReloading) return;
    this.isReloading = true;
    this.events.emit('reloadStart');

    this.time.delayedCall(MANIFEST.game_config.player.reload_time_ms, () => {
      this.ammo = MANIFEST.game_config.player.max_ammo;
      this.isReloading = false;
      this.events.emit('reloadEnd');
      this.events.emit('ammoChanged', this.ammo);
    });
  }

  hitEnemy(bullet, enemy) {
    bullet.destroy();
    if (SharedSystems.applyDamage(this, enemy, 25)) {
      this.killEnemy(enemy);
    }
  }

  killEnemy(enemy) {
    const pts = enemy.isBoss ? 500 : 50;
    this.score += pts;
    this.events.emit('scoreChanged', this.score);

    if (enemy.isBoss) this.bossAlive = false;

    enemy.destroy();
    this.enemiesLeft--;

    if (this.enemiesLeft <= 0) {
      this.waveActive = false;
      this.waveNum++;
      this.events.emit('waveEnd', this.waveNum - 1);
      this.time.delayedCall(2500, () => {
        if (!this.gameOver) this.startWave();
      });
    }
  }

  enemyTouchPlayer(player, enemy) {
    const now = this.time.now;
    if (now - enemy.lastDamageTime < 600) return;
    enemy.lastDamageTime = now;

    this.hp -= enemy.damage;
    this.events.emit('hpChanged', this.hp);
    this.cameras.main.shake(80, 0.008);

    // Player flash red
    player.setTint(0xff0000);
    this.time.delayedCall(100, () => player.clearTint());

    if (this.hp <= 0) this.triggerGameOver();
  }

  triggerGameOver() {
    this.gameOver = true;
    this.physics.pause();
    this.player.setTint(0xff0000);
    this.events.emit('gameOver', this.score, this.waveNum);
  }

  // ── UPDATE LOOP ────────────────────────────────────────────
  update(time, delta) {
    if (this.gameOver) return;

    const cfg = MANIFEST.game_config;
    const k   = this.keys;
    const spd = cfg.physics.player_speed;

    // ── Player movement ──
    let vx = 0, vy = 0;
    if (k.left.isDown  || k.left2.isDown)  vx = -spd;
    if (k.right.isDown || k.right2.isDown) vx =  spd;
    if (k.up.isDown    || k.up2.isDown)    vy = -spd;
    if (k.down.isDown  || k.down2.isDown)  vy =  spd;

    // Normalize diagonals
    if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }

    this.player.body.setVelocity(vx, vy);

    if (vx !== 0 || vy !== 0) {
      this.player.play('player_walk', true);
      // Flip based on movement direction
      if (vx < 0) this.player.setFlipX(true);
      else if (vx > 0) this.player.setFlipX(false);
    } else {
      if (!this.player.anims.currentAnim?.key.includes('shoot')) {
        this.player.play('player_idle', true);
      }
    }

    // ── Reload input ──
    if (Phaser.Input.Keyboard.JustDown(k.reload)) this.startReload();

    // ── Enemy AI — pathfind toward player ──
    this.enemies.children.each(enemy => {
      const angle = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y);
      enemy.body.setVelocity(
        Math.cos(angle) * enemy.speed,
        Math.sin(angle) * enemy.speed
      );
      // Face player
      if (this.player.x < enemy.x) enemy.setFlipX(true);
      else enemy.setFlipX(false);
    });

    // Projectile TTL + wall colliders handle cleanup (Sprint 8A)
  }
}

// ============================================================
// HUD SCENE — Runs in parallel with GameScene
// ============================================================
class HUDScene extends Phaser.Scene {
  constructor() { super('HUDScene'); }

  init(data) { this.gameScene = data.gameScene; }

  create() {
    const cfg = MANIFEST.game_config;
    const hudColor     = MANIFEST.palette.hud_text;
    const hudDim       = MANIFEST.palette.hud_dim;
    const MAX_HP       = cfg.player.max_hp;
    const MAX_AMMO     = cfg.player.max_ammo;

    // ── Top bar background ──
    const topBar = this.add.rectangle(W / 2, 12, W, 22, 0x000000, 0.75).setDepth(20);

    // ── HP Bar ──
    this.add.text(8, 5, 'HP', {
      fontSize: '8px', fontFamily: 'Courier New', color: hudDim, fixedWidth: 0
    }).setDepth(21);

    this.hpBg  = this.add.rectangle(30, 12, 80, 8, 0x440000, 1).setDepth(21).setOrigin(0, 0.5);
    this.hpBar = this.add.rectangle(30, 12, 80, 8, 0xff2200, 1).setDepth(22).setOrigin(0, 0.5);

    // ── Ammo ──
    this.ammoText = this.add.text(W / 2 - 30, 5, `${MAX_AMMO}/${MAX_AMMO}`, {
      fontSize: '9px', fontFamily: 'Courier New', color: hudColor
    }).setDepth(21);

    this.add.text(W / 2 - 48, 5, 'AMMO', {
      fontSize: '7px', fontFamily: 'Courier New', color: hudDim
    }).setDepth(21);

    // ── Wave & Score ──
    this.waveText = this.add.text(W - 110, 5, 'WAVE  1', {
      fontSize: '9px', fontFamily: 'Courier New', color: hudColor
    }).setDepth(21);

    this.scoreText = this.add.text(W - 110, 14, 'SCORE 0', {
      fontSize: '7px', fontFamily: 'Courier New', color: hudDim
    }).setDepth(21);

    // ── Reload indicator ──
    this.reloadText = this.add.text(W / 2, H / 2 + 30, 'RELOADING...', {
      fontSize: '10px', fontFamily: 'Courier New', color: '#ffcc00',
      stroke: '#000000', strokeThickness: 2
    }).setDepth(30).setOrigin(0.5).setVisible(false);

    // ── Wave announcement ──
    this.waveAnnounce = this.add.text(W / 2, H / 2, '', {
      fontSize: '18px', fontFamily: 'Courier New', color: hudColor,
      stroke: '#000000', strokeThickness: 3
    }).setDepth(30).setOrigin(0.5).setAlpha(0);

    // ── Enemy count bar (bottom) ──
    this.add.text(8, H - 14, 'ENEMIES', {
      fontSize: '7px', fontFamily: 'Courier New', color: hudDim
    }).setDepth(21);

    this.enemyCountText = this.add.text(60, H - 14, '', {
      fontSize: '8px', fontFamily: 'Courier New', color: hudColor
    }).setDepth(21);

    // ── Wire up events from GameScene ──
    const gs = this.gameScene;

    gs.events.on('hpChanged', (hp) => {
      const pct = Math.max(0, hp / MAX_HP);
      this.hpBar.width = 80 * pct;
      const col = pct > 0.5 ? 0xff2200 : pct > 0.25 ? 0xff6600 : 0xff0000;
      this.hpBar.fillColor = col;
      // Flash on low HP
      if (pct < 0.25) {
        this.tweens.add({ targets: this.hpBar, alpha: 0.3, duration: 100, yoyo: true });
      }
    });

    gs.events.on('ammoChanged', (ammo) => {
      this.ammoText.setText(`${ammo}/${MAX_AMMO}`);
      this.ammoText.setColor(ammo <= 5 ? '#ff6600' : MANIFEST.palette.hud_text);
    });

    gs.events.on('reloadStart', () => {
      this.reloadText.setVisible(true);
      this.tweens.add({
        targets: this.reloadText, alpha: { from: 1, to: 0.3 },
        duration: 300, yoyo: true, repeat: -1, key: 'reloadPulse'
      });
    });

    gs.events.on('reloadEnd', () => {
      this.reloadText.setVisible(false);
      this.tweens.killTweensOf(this.reloadText);
      this.reloadText.setAlpha(1);
    });

    gs.events.on('scoreChanged', (score) => {
      this.scoreText.setText(`SCORE ${score}`);
    });

    gs.events.on('waveStart', (waveNum, isBoss) => {
      this.waveText.setText(`WAVE  ${waveNum}`);
      const msg = isBoss ? `⚠ BOSS WAVE ${waveNum} ⚠` : `— WAVE ${waveNum} —`;
      const col = isBoss ? '#ff6600' : MANIFEST.palette.hud_text;
      this.waveAnnounce.setText(msg).setColor(col).setAlpha(1);
      this.tweens.add({
        targets: this.waveAnnounce,
        alpha: 0, duration: 1200, delay: 1000, ease: 'Power2'
      });
      if (isBoss) this.cameras.main.flash(200, 255, 100, 0, false);
    });

    gs.events.on('waveEnd', (completedWave) => {
      this.waveAnnounce.setText(`WAVE ${completedWave} CLEAR`).setColor('#44ff44').setAlpha(1);
      this.tweens.add({
        targets: this.waveAnnounce,
        alpha: 0, duration: 800, delay: 1500
      });
    });

    gs.events.on('gameOver', (score, wave) => {
      // Darken
      this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.7).setDepth(40);
      this.add.text(W / 2, H / 2 - 35, 'YOU DIED', {
        fontSize: '28px', fontFamily: 'Courier New', color: '#ff0000',
        stroke: '#000000', strokeThickness: 4
      }).setDepth(41).setOrigin(0.5);
      this.add.text(W / 2, H / 2, `SURVIVED ${wave - 1} WAVES`, {
        fontSize: '11px', fontFamily: 'Courier New', color: '#ff4400'
      }).setDepth(41).setOrigin(0.5);
      this.add.text(W / 2, H / 2 + 18, `FINAL SCORE: ${score}`, {
        fontSize: '11px', fontFamily: 'Courier New', color: '#ffcc00'
      }).setDepth(41).setOrigin(0.5);
      this.add.text(W / 2, H / 2 + 42, 'REFRESH TO RETRY', {
        fontSize: '9px', fontFamily: 'Courier New', color: '#666666'
      }).setDepth(41).setOrigin(0.5);
    });

    // Update enemy count every frame
    this.time.addEvent({
      delay: 200, loop: true,
      callback: () => {
        const n = gs.enemies ? gs.enemies.countActive(true) : 0;
        this.enemyCountText.setText(`${n} REMAINING`);
      }
    });
  }
}

// ============================================================
// PLATFORMER GAME SCENE — Side Scroll Template
// ============================================================
class PlatformerScene extends Phaser.Scene {
  constructor() { super('PlatformerScene'); }

  create() {
    const cfg  = MANIFEST.game_config;
    const p    = MANIFEST.palette;
    const phys = cfg.physics || {};

    this.score    = 0;
    this.lives    = cfg.player?.lives || 3;
    this.gameOver = false;
    this._invincible = false;

    // Enable gravity for platformer
    this.physics.world.gravity.y = phys.gravity || 800;

    // ── Build level from tilemap ──
    const renderer = new TilemapRenderer(this);
    const { walls, playerSpawn, enemySpawns, itemSpawns, worldWidth, worldHeight } = renderer.build();
    this.platforms = walls;

    // ── Sky background ──
    const skyColor = typeof p.background === 'number'
      ? p.background : parseInt((p.background || '#1a3a6a').replace('#',''), 16);
    this.add.rectangle(worldWidth / 2, worldHeight / 2, worldWidth * 2, worldHeight, skyColor).setDepth(0);

    // ── Pixel clouds for atmosphere ──
    for (let i = 0; i < 12; i++) {
      const cx = 80 + i * ((worldWidth - 160) / 11) + Phaser.Math.Between(-30, 30);
      const cy = Phaser.Math.Between(30, 90);
      this.add.rectangle(cx,    cy,    32, 12, 0xffffff, 0.7).setDepth(1);
      this.add.rectangle(cx-10, cy+6,  12, 8,  0xffffff, 0.5).setDepth(1);
      this.add.rectangle(cx+10, cy+6,  12, 8,  0xffffff, 0.5).setDepth(1);
    }

    // ── Player — use real sprite if available, else draw a shape ──
    const spawnX = playerSpawn ? playerSpawn.x : 48;
    const spawnY = playerSpawn ? playerSpawn.y : worldHeight - 48;
    const useRealPlayer = MANIFEST?.assets?.sprites?.sprite_player;
    if (useRealPlayer) {
      this.player = this.physics.add.sprite(spawnX, spawnY, 'player', 0);
      this.player.setScale(2);
    } else {
      const gfx = this.add.graphics();
      gfx.fillStyle(0xff4400);
      gfx.fillRect(0, 0, 16, 20);
      gfx.generateTexture('player_rect', 16, 20);
      gfx.destroy();
      this.player = this.physics.add.sprite(spawnX, spawnY, 'player_rect');
    }
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(14, 18);
    this.player.setDepth(10);

    // ── Enemies ───────────────────────────────────────────────
    this.enemies = this.physics.add.group();
    const spd = cfg.enemy?.base_speed || 40;
    const enemyColor = hexColor(p.accent, '#ff2200');

    enemySpawns.forEach(sp => {
      const gfx = this.make.graphics({ x: 0, y: 0, add: false });
      gfx.fillStyle(enemyColor);
      gfx.fillRect(0, 0, 14, 14);
      gfx.fillStyle(0xffffff);
      gfx.fillRect(2, 2, 4, 4);
      gfx.fillRect(8, 2, 4, 4);
      gfx.fillStyle(0x000000);
      gfx.fillRect(3, 3, 2, 2);
      gfx.fillRect(9, 3, 2, 2);
      if (!this.textures.exists('enemy_body')) {
        gfx.generateTexture('enemy_body', 14, 14);
      }
      gfx.destroy();
      const e = this.physics.add.sprite(sp.x, sp.y - TILE/2, 'enemy_body').setDepth(5);
      e.body.setSize(14, 14);
      e.hp = 1;
      e.setVelocityX(spd);
      this.enemies.add(e);
    });

    // ── Coins + Goal ──────────────────────────────────────────
    this.coins = [];
    this.goalX = null;

    itemSpawns.forEach(sp => {
      if (sp.tileType === 'goal') {
        this.goalX = sp.x;
        this.add.rectangle(sp.x, sp.y - TILE/2 - 4, 4, TILE + 8, 0xffffff).setDepth(5);
        this.add.rectangle(sp.x + 8, sp.y - TILE - 8, 18, 10, 0xffff00).setDepth(5);
        this.add.text(sp.x - 8, sp.y - TILE - 22, 'GOAL', {
          fontSize: '8px', fontFamily: 'Courier New', color: '#ffff00'
        }).setDepth(5);
      } else {
        const coinColor = hexColor(p.highlight, '#ffcc00');
        const coin = this.add.circle(sp.x, sp.y, 5, coinColor).setDepth(4);
        coin.collected = false;
        this.coins.push(coin);
      }
    });

    // ── Collisions ────────────────────────────────────────────
    this.physics.add.collider(this.player, this.platforms, null, this._platformCollide, this);
    this.physics.add.collider(this.enemies, this.platforms);
    this.physics.add.overlap(this.player, this.enemies, this._hitEnemy, null, this);

    // ── Camera ────────────────────────────────────────────────
    this.cameras.main.setBounds(0, 0, worldWidth, worldHeight);
    this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
    this.cameras.main.setZoom(1.5);
    this.cameras.main.setBackgroundColor(skyColor);

    // ── Input ─────────────────────────────────────────────────
    this.keys = this.input.keyboard.addKeys({
      left:  Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D,
      jump:  Phaser.Input.Keyboard.KeyCodes.W,
      left2: Phaser.Input.Keyboard.KeyCodes.LEFT,
      right2:Phaser.Input.Keyboard.KeyCodes.RIGHT,
      jump2: Phaser.Input.Keyboard.KeyCodes.UP,
      jump3: Phaser.Input.Keyboard.KeyCodes.SPACE,
    });

    // ── HUD ───────────────────────────────────────────────────
    this.scene.launch('PlatformerHUD', { gameScene: this });
  }

  _platformCollide(player, tile) {
    if (tile.tileType === 'platform') {
      return player.body.velocity.y >= 0;
    }
    return true;
  }

  _hitEnemy(player, enemy) {
    if (player.body.velocity.y > 0 && player.y < enemy.y - 8) {
      enemy.destroy();
      this.score += 100;
      this.events.emit('scoreChanged', this.score);
      player.setVelocityY(-250);
      this.cameras.main.shake(60, 0.005);
    } else {
      if (this._invincible) return;
      this._invincible = true;
      this.lives--;
      this.events.emit('livesChanged', this.lives);
      player.setTint(0xff0000);
      this.time.delayedCall(1500, () => {
        player.clearTint();
        this._invincible = false;
      });
      if (this.lives <= 0) this._triggerGameOver();
    }
  }

  _triggerGameOver() {
    this.gameOver = true;
    this.physics.pause();
    this.events.emit('gameOver', this.score);
  }

  update() {
    if (this.gameOver) return;
    const k   = this.keys;
    const spd = MANIFEST.game_config.physics?.player_speed || 160;
    const worldW = this.platforms ? this.cameras.main._bounds.x + this.cameras.main._bounds.width : W * 4;

    if (k.left.isDown || k.left2.isDown) {
      this.player.setVelocityX(-spd);
      this.player.setFlipX(true);
    } else if (k.right.isDown || k.right2.isDown) {
      this.player.setVelocityX(spd);
      this.player.setFlipX(false);
    } else {
      this.player.setVelocityX(0);
    }

    const onGround = this.player.body.blocked.down;
    if ((k.jump.isDown || k.jump2.isDown || k.jump3.isDown) && onGround) {
      this.player.setVelocityY(MANIFEST.game_config.physics?.jump_velocity || -420);
    }

    this.enemies.children.each(e => {
      if (!e.active) return;
      if (e.body.blocked.right || e.x > worldW - 20) {
        e.setVelocityX(-Math.abs(e.body.velocity.x));
        e.setFlipX(true);
      }
      if (e.body.blocked.left || e.x < 20) {
        e.setVelocityX(Math.abs(e.body.velocity.x));
        e.setFlipX(false);
      }
    });

    const px = this.player.x, py = this.player.y;
    this.coins.forEach(coin => {
      if (coin.collected) return;
      if (Math.abs(coin.x - px) < 16 && Math.abs(coin.y - py) < 16) {
        coin.setVisible(false);
        this.score += 10;
        this.events.emit('scoreChanged', this.score);
        coin.collected = true;
      }
    });

    if (this.goalX !== null && this.player.x >= this.goalX - 20) {
      this.score += 500;
      this.events.emit('levelComplete', this.score);
      this.gameOver = true;
      this.physics.pause();
    }
  }
}
