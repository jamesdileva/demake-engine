// ============================================================
// TOP DOWN ACTION RPG SCENE — Kingdom Hearts / Zelda style
// ============================================================
class TopDownRPGScene extends Phaser.Scene {
  constructor() { super('TopDownRPGScene'); }

  create() {
    const cfg = MANIFEST.game_config;
    const p   = MANIFEST.palette;
    const bgColor = typeof p.background === 'number' ? p.background
      : parseInt((p.background || '#0a0a1a').replace('#',''), 16);

    this.hp      = cfg.combat?.max_hp    || 120;
    this.maxHp   = this.hp;
    this.mp      = cfg.combat?.max_mp    || 60;
    this.maxMp   = this.mp;
    this.score   = 0;
    this.gameOver = false;
    this._attackCooldown = 0;
    this._dodgeCooldown  = 0;
    this.inventory = new Inventory(6);  // Sprint 8A

    // ── World — TilemapRenderer ────────────────────────────
    const tileRenderer = new TilemapRenderer(this);
    const { walls, playerSpawn, enemySpawns: tileEnemySpawns,
            itemSpawns, worldWidth, worldHeight } = tileRenderer.build();
    this.walls       = walls;
    this.worldW      = worldWidth;
    this.worldH      = worldHeight;

    // ── Projectiles (magic bolts) — Sprint 8A ───────────────
    this.projectiles = new ProjectileSystem(this, 'bolt', walls);

    // ── Chests from WFC item spawns — Sprint 8A ─────────────
    this.chestPositions = itemSpawns
      .filter(sp => sp.tileType === 'chest')
      .map(sp => ({ x: sp.x, y: sp.y, opened: false }));
    if (this.chestPositions.length === 0 && itemSpawns.length > 0) {
      // Fallback: treat first item spawn as a chest
      const sp = itemSpawns[0];
      this.chestPositions.push({ x: sp.x, y: sp.y, opened: false });
    }
    if (this.chestPositions.length === 0) {
      // No tilemap (smoke-test fallback) — guarantee one chest on open floor
      const spot = this._findOpenSpot(worldWidth, worldHeight, playerSpawn);
      this.chestPositions.push({ x: spot.x, y: spot.y, opened: false });
    }

    // Chest visuals — brown box + gold star marker
    this.chestPositions.forEach(c => {
      c.rect = this.add.rectangle(c.x, c.y, 14, 10, 0x8b4513).setDepth(4);
      c.rect.setStrokeStyle(1, 0xffd700);
      this.add.text(c.x - 5, c.y - 15, '★',
        { fontSize: '10px', color: '#ffd700' }).setDepth(4);
    });

    // ── Player ───────────────────────────────────────────────
    this.player = this.physics.add.sprite(playerSpawn.x, playerSpawn.y, 'player', 0);
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(12, 12);
    this.player.setDepth(10).setScale(1.5);
    if (this.anims.exists('player_idle')) this.player.play('player_idle');

    // ── Enemies ───────────────────────────────────────────────
    this.enemies = this.physics.add.group();
    const spd = cfg.enemy?.base_speed || 45;
    const hp  = cfg.enemy?.base_hp    || 50;
    (tileEnemySpawns.length > 0 ? tileEnemySpawns
      : [{ x: 80, y: 80 }, { x: 400, y: 80 }, { x: 80, y: 240 }, { x: 400, y: 240 }, { x: worldWidth/2, y: worldHeight/2 }]
    ).forEach(({ x, y }) => {
      const e = this.enemies.create(x, y, 'enemy', 0);
      e.setDepth(5).setScale(1.2);
      e.body.setSize(12, 12);
      e.hp = hp; e.maxHp = hp; e.speed = spd;
      e.lastDamage = 0;
      if (this.anims.exists('enemy_walk')) e.play('enemy_walk');
    });

    // ── Collisions ────────────────────────────────────────────
    this.physics.add.collider(this.player,  this.walls);
    this.physics.add.collider(this.enemies, this.walls);
    this.physics.add.overlap(this.player, this.enemies, this._touchEnemy, null, this);
    this.physics.add.overlap(this.projectiles.group, this.enemies, this._magicHit, null, this);
    // In TopDownRPGScene.create(), after collisions, add a camera follow + zoom:
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
    this.cameras.main.setZoom(1.5);
    // ── Input ─────────────────────────────────────────────────
    this.keys = this.input.keyboard.addKeys({
      up:    Phaser.Input.Keyboard.KeyCodes.W,
      down:  Phaser.Input.Keyboard.KeyCodes.S,
      left:  Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D,
      attack:Phaser.Input.Keyboard.KeyCodes.SPACE,
      dodge: Phaser.Input.Keyboard.KeyCodes.SHIFT,
      magic: Phaser.Input.Keyboard.KeyCodes.E,
      potion:Phaser.Input.Keyboard.KeyCodes.Q,
    });

    this.scene.launch('TopDownHUD', { gameScene: this });
  }

  _touchEnemy(player, enemy) {
    const now = this.time.now;
    if (now - enemy.lastDamage < 800) return;
    enemy.lastDamage = now;
    const dmg = MANIFEST.game_config.enemy?.damage || 15;
    this.hp -= dmg;
    this.events.emit('hpChanged', this.hp);
    this.cameras.main.shake(80, 0.008);
    player.setTint(0xff0000);
    this.time.delayedCall(150, () => player.clearTint());
    if (this.hp <= 0) { this.gameOver = true; this.physics.pause(); this.events.emit('gameOver', this.score); }
  }

  // Open-floor point 50-110px from player spawn (stays on camera at 1.5x zoom),
  // clear of walls
  _findOpenSpot(worldW, worldH, playerSpawn) {
    for (let i = 0; i < 40; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = Phaser.Math.Between(50, 110);
      const x = Phaser.Math.Clamp(playerSpawn.x + Math.cos(ang) * dist, 30, worldW - 30);
      const y = Phaser.Math.Clamp(playerSpawn.y + Math.sin(ang) * dist, 30, worldH - 30);
      let ok = true;
      this.walls.children.each(wall => {
        if (Phaser.Math.Distance.Between(x, y, wall.x, wall.y) < 24) ok = false;
      });
      if (ok) return { x, y };
    }
    return { x: worldW / 2, y: worldH / 2 };
  }

  // ── Chest interaction — SPACE near an unopened chest (Sprint 8A) ──
  _tryOpenChest() {
    let nearest = null, nd = Infinity;
    this.chestPositions.forEach(c => {
      if (c.opened) return;
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, c.x, c.y);
      if (d < nd) { nd = d; nearest = c; }
    });
    if (!nearest || nd > 30) return false;

    nearest.opened = true;
    if (nearest.rect) nearest.rect.setFillStyle(0x3a2a1a);  // darkened = looted
    this.inventory.add('potion', 1);
    this.events.emit('inventoryChanged', this.inventory);
    SharedSystems.floatText(this, nearest.x, nearest.y, '+ POTION', '#ff8888');
    this.score += 50;
    this.events.emit('scoreChanged', this.score);
    return true;
  }

  // ── Magic bolt hit — Sprint 8A ──
  _magicHit(proj, enemy) {
    proj.destroy();
    if (SharedSystems.applyDamage(this, enemy, proj.damage || 30, { tint: 0x8800ff })) {
      this.score += 150;
      this.events.emit('scoreChanged', this.score);
      enemy.destroy();
    }
  }

  update(time) {
    if (this.gameOver) return;
    const k   = this.keys;
    const spd = MANIFEST.game_config.physics?.player_speed || 110;
    let vx = 0, vy = 0;
    if (k.left.isDown)  vx = -spd;
    if (k.right.isDown) vx =  spd;
    if (k.up.isDown)    vy = -spd;
    if (k.down.isDown)  vy =  spd;
    if (vx && vy) { vx *= 0.707; vy *= 0.707; }
    this.player.body.setVelocity(vx, vy);
    if (vx || vy) {
      if (this.anims.exists('player_walk')) this.player.play('player_walk', true);
      if (vx < 0) this.player.setFlipX(true);
      else if (vx > 0) this.player.setFlipX(false);
    } else {
      if (this.anims.exists('player_idle')) this.player.play('player_idle', true);
    }

    // Attack — melee AoE; opens a nearby chest instead if one is in range (Sprint 8A)
    if (Phaser.Input.Keyboard.JustDown(k.attack) && time > this._attackCooldown) {
      this._attackCooldown = time + 400;
      if (this._tryOpenChest()) {
        // Chest opened — skip the swing
      } else {
        const atk = MANIFEST.game_config.combat?.attack_damage || 25;
        const range = MANIFEST.game_config.combat?.attack_range || 50;
        if (this.anims.exists('player_shoot')) this.player.play('player_shoot', true);
        this.cameras.main.shake(60, 0.005);
        this.enemies.children.each(e => {
          if (!e.active) return;
          const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, e.x, e.y);
          if (dist < range) {
            if (SharedSystems.applyDamage(this, e, atk)) {
              this.score += 100;
              this.events.emit('scoreChanged', this.score);
              e.destroy();
            }
          }
        });
      }
    }

    // Magic — costs MP, fires a bolt at the nearest enemy (Sprint 8A)
    if (Phaser.Input.Keyboard.JustDown(k.magic) && this.mp >= 10) {
      this.mp -= 10;
      this.events.emit('mpChanged', this.mp);
      const mgk = MANIFEST.game_config.combat?.base_magic || 30;

      let target = null, best = Infinity;
      this.enemies.children.each(e => {
        if (!e.active) return;
        const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, e.x, e.y);
        if (d < best) { best = d; target = e; }
      });
      const ang = target
        ? Phaser.Math.Angle.Between(this.player.x, this.player.y, target.x, target.y)
        : (this.player.flipX ? Math.PI : 0);
      this.projectiles.fire(this.player.x, this.player.y, ang, 260,
        { texture: 'bolt', damage: mgk, tint: 0xaa66ff, ttlMs: 2000 });
    }

    // Potion — Q consumes one from inventory (Sprint 8A)
    if (Phaser.Input.Keyboard.JustDown(k.potion) &&
        this.inventory.has('potion') && this.hp < this.maxHp) {
      this.inventory.remove('potion');
      const heal = Math.round(this.maxHp * 0.4);
      this.hp = Math.min(this.maxHp, this.hp + heal);
      this.events.emit('hpChanged', this.hp);
      this.events.emit('inventoryChanged', this.inventory);
      SharedSystems.floatText(this, this.player.x, this.player.y, `+${heal} HP`, '#44ff44');
    }

    // Enemy AI — chase player
    this.enemies.children.each(e => {
      if (!e.active) return;
      const angle = Phaser.Math.Angle.Between(e.x, e.y, this.player.x, this.player.y);
      e.body.setVelocity(Math.cos(angle) * e.speed, Math.sin(angle) * e.speed);
      e.setFlipX(this.player.x < e.x);
    });

    // Win condition — all enemies defeated
    if (this.enemies.countActive(true) === 0 && !this.gameOver) {
      this.gameOver = true;
      this.score += 500;
      this.events.emit('roomClear', this.score);
    }
  }
}

class TopDownHUD extends Phaser.Scene {
  constructor() { super('TopDownHUD'); }
  init(data) { this.gs = data.gameScene; }
  create() {
    const hc = MANIFEST.palette.hud_text || '#ff6600';
    this.add.rectangle(W/2, 11, W, 22, 0x000000, 0.8).setDepth(20);
    this.add.text(6, 4, 'HP', { fontSize: '8px', fontFamily: 'Courier New', color: '#662200' }).setDepth(21);
    this.hpBg  = this.add.rectangle(28, 11, 80, 8, 0x440000).setDepth(21).setOrigin(0,0.5);
    this.hpBar = this.add.rectangle(28, 11, 80, 8, 0xff2200).setDepth(22).setOrigin(0,0.5);
    this.add.text(115, 4, 'MP', { fontSize: '8px', fontFamily: 'Courier New', color: '#220044' }).setDepth(21);
    this.mpBg  = this.add.rectangle(136, 11, 60, 8, 0x110022).setDepth(21).setOrigin(0,0.5);
    this.mpBar = this.add.rectangle(136, 11, 60, 8, 0x8800ff).setDepth(22).setOrigin(0,0.5);
    this.scoreText = this.add.text(W-100, 4, 'SCORE 0', { fontSize: '8px', fontFamily: 'Courier New', color: hc }).setDepth(21);
    this.add.text(W/2-60, 4, 'SPACE-ATK  E-MAGIC', { fontSize: '7px', fontFamily: 'Courier New', color: '#444' }).setDepth(21);
    this.potText = this.add.text(W-100, 14, '', { fontSize: '8px', fontFamily: 'Courier New', color: '#ff8888' }).setDepth(21);

    const gs = this.gs;
    const maxHp = gs.maxHp, maxMp = gs.maxMp;
    gs.events.on('hpChanged', v => { this.hpBar.width = 80 * Math.max(0,v)/maxHp; });
    gs.events.on('mpChanged', v => { this.mpBar.width = 60 * Math.max(0,v)/maxMp; });
    gs.events.on('scoreChanged', v => this.scoreText.setText(`SCORE ${v}`));
    gs.events.on('inventoryChanged', inv => {
      const n = inv.count('potion');
      this.potText.setText(n > 0 ? `POTION x${n} (Q)` : '');
    });
    gs.events.on('roomClear', score => this._endScreen('ROOM CLEAR!', '#44ff44', score));
    gs.events.on('gameOver', score => this._endScreen('YOU DIED', '#ff0000', score));
  }
  _endScreen(title, color, score) {
    this.add.rectangle(W/2,H/2,W,H,0x000000,0.75).setDepth(40);
    this.add.text(W/2,H/2-20, title, { fontSize:'22px', fontFamily:'Courier New', color, stroke:'#000', strokeThickness:3 }).setDepth(41).setOrigin(0.5);
    this.add.text(W/2,H/2+8, `SCORE: ${score}`, { fontSize:'11px', fontFamily:'Courier New', color:'#ffcc00' }).setDepth(41).setOrigin(0.5);
    this.add.text(W/2,H/2+26, 'REFRESH TO RETRY', { fontSize:'9px', fontFamily:'Courier New', color:'#666' }).setDepth(41).setOrigin(0.5);
  }
}

// ============================================================
// OPEN WORLD SANDBOX SCENE — GTA style top-down
// ============================================================
class OpenWorldScene extends Phaser.Scene {
  constructor() { super('OpenWorldScene'); }

  create() {
    const cfg = MANIFEST.game_config;
    const p   = MANIFEST.palette;
    this.hp      = cfg.player?.max_hp || 100;
    this.cash    = cfg.player?.cash   || 0;
    this.wanted  = 0;
    this.maxWanted = cfg.world?.wanted_max || 5;
    this.gameOver  = false;
    this._damageCooldown = 0;
    this._lastCrimeTime = 0;   // Sprint 8D — wanted decay timer
    this._grabTimer     = 0;   // Sprint 8D — busted accumulation

    // ── World — TilemapRenderer ────────────────────────────
    const tileRenderer = new TilemapRenderer(this);
    const { walls, playerSpawn, enemySpawns: tileEnemySpawns,
            itemSpawns, worldWidth, worldHeight } = tileRenderer.build();
    this.walls  = walls;
    this.worldW = worldWidth;
    this.worldH = worldHeight;
    this.playerSpawn = { x: playerSpawn.x, y: playerSpawn.y };

    // ── NPCs ──────────────────────────────────────────────────
    this.npcs = this.physics.add.group();
    const npcPositions = tileEnemySpawns.length > 0 ? tileEnemySpawns
      : Array.from({ length: cfg.world?.npc_count || 8 }, () => ({
          x: Phaser.Math.Between(60, worldWidth - 60),
          y: Phaser.Math.Between(60, worldHeight - 60),
        }));
    npcPositions.forEach(({ x, y }) => {
      const npc = this.npcs.create(x, y, 'enemy', 0);
      npc.setDepth(5).setScale(0.9);
      npc.body.setSize(10, 10);
      npc.isHostile = false;
      npc.wanderAngle = Math.random() * Math.PI * 2;
      npc.wanderTimer = 0;
    });

    // ── Player ─────────────────────────────────────────────────
    this.player = this.physics.add.sprite(playerSpawn.x, playerSpawn.y, 'player', 0);
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(12,12);
    this.player.setDepth(10).setScale(1.5);
    if (this.anims.exists('player_idle')) this.player.play('player_idle');

    // ── Mission marker ─────────────────────────────────────────
    if (itemSpawns.length > 0) {
      const m = Phaser.Utils.Array.GetRandom(itemSpawns);
      this.missionX = m.x; this.missionY = m.y;
    } else {
      this.missionX = worldWidth * 0.75; this.missionY = worldHeight * 0.25;
    }
    this.missionMarker = this.add.text(this.missionX, this.missionY, '★',
      { fontSize:'18px', color:'#ffff00' }).setDepth(8).setOrigin(0.5);
    this.add.text(this.missionX, this.missionY-16, 'MISSION',
      { fontSize:'7px', fontFamily:'Courier New', color:'#ffff00' }).setDepth(8).setOrigin(0.5);

    // ── Physics ────────────────────────────────────────────────
    this.police = this.physics.add.group();  // Sprint 8D
    this.projectiles = new ProjectileSystem(this, 'bullet', walls);  // pistol
    this.physics.add.collider(this.player, this.walls);
    this.physics.add.collider(this.npcs,   this.walls);
    this.physics.add.collider(this.police, this.walls);
    this.physics.add.overlap(this.player, this.police, this._touchPolice, null, this);
    this.physics.add.overlap(this.projectiles.group, this.npcs,   this._shootNPC, null, this);
    this.physics.add.overlap(this.projectiles.group, this.police, this._shootCop, null, this);

    // ── Camera ─────────────────────────────────────────────────
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
    this.cameras.main.setZoom(1.5);

    // ── Input ──────────────────────────────────────────────────
    this.keys = this.input.keyboard.addKeys({
      up:    Phaser.Input.Keyboard.KeyCodes.W,
      down:  Phaser.Input.Keyboard.KeyCodes.S,
      left:  Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D,
      attack:Phaser.Input.Keyboard.KeyCodes.SPACE,
    });

    this.scene.launch('OpenWorldHUD', { gameScene: this });
  }

  // ── Sprint 8D — wanted level management ────────────────────
  _setWanted(n) {
    n = Phaser.Math.Clamp(n, 0, this.maxWanted);
    if (n === this.wanted) return;
    this.wanted = n;
    this._lastCrimeTime = this.time.now;

    // Keep one active cop per star
    const active = this.police.countActive(true);
    if (n > active) this._spawnPolice(n - active);
    if (n === 0) {
      this.police.children.each(c => { if (c.active) c.destroy(); });
      this._grabTimer = 0;
    }
    this.events.emit('wantedChanged', n);
  }

  _spawnPolice(count) {
    for (let i = 0; i < count; i++) {
      // Spawn just off a random world edge
      const edge = Phaser.Math.Between(0, 3);
      const x = edge === 0 ? 20 : edge === 1 ? this.worldW - 20
              : Phaser.Math.Between(40, this.worldW - 40);
      const y = edge < 2 ? Phaser.Math.Between(40, this.worldH - 40)
              : (edge === 2 ? 20 : this.worldH - 20);
      const cop = this.police.create(x, y, 'enemy', 0);
      cop.setTint(0x4488ff).setDepth(6).setScale(0.9);  // blue = police
      cop.body.setSize(10, 10);
      cop.hp = cop.maxHp = 30 + this.wanted * 10;
      cop.speed  = 55 + this.wanted * 15;
      cop.damage = 6 + this.wanted * 3;
    }
  }

  // ── Pistol fire — facing direction (Sprint 8D feedback) ────
  _fire() {
    const ang = this.player.flipX ? Math.PI : 0;
    this.projectiles.fire(this.player.x, this.player.y, ang, 320,
      { damage: 34, ttlMs: 1500 });
    this.cameras.main.shake(40, 0.003);
  }

  _shootNPC(proj, npc) {
    proj.destroy();
    npc.destroy();
    this._setWanted(this.wanted + 1);
  }

  _shootCop(proj, cop) {
    proj.destroy();
    if (SharedSystems.applyDamage(this, cop, proj.damage, { tint: 0x4488ff })) {
      cop.destroy();
      this._setWanted(this.wanted + 1);  // shooting a cop is a crime
    }
  }

  _touchPolice(player, cop) {
    const now = this.time.now;
    if (now - this._damageCooldown < 600) return;
    this._damageCooldown = now;
    this.hp -= cop.damage || 12;
    this.events.emit('hpChanged', this.hp);
    this.cameras.main.shake(80, 0.008);
    player.setTint(0x4488ff);
    this.time.delayedCall(150, () => player.clearTint());
    if (this.hp <= 0) { this.gameOver = true; this.physics.pause(); this.events.emit('gameOver', this.cash); }
  }

  // Arrest: 3★+ and 2+ cops in grab range for 1.5s → lose half cash, reset heat
  _checkBusted(delta) {
    if (this.wanted < 3) { this._grabTimer = 0; return; }
    let grabbing = 0;
    this.police.children.each(cop => {
      if (cop.active &&
          Phaser.Math.Distance.Between(cop.x, cop.y, this.player.x, this.player.y) < 30) {
        grabbing++;
      }
    });
    this._grabTimer = grabbing >= 2 ? this._grabTimer + delta : 0;
    if (this._grabTimer >= 1500) {
      this.cash = Math.floor(this.cash / 2);
      this.events.emit('cashChanged', this.cash);
      this._setWanted(0);
      this.player.setPosition(this.playerSpawn.x, this.playerSpawn.y);
      this.cameras.main.flash(300, 0, 0, 255);
      this.events.emit('busted', this.cash);
    }
  }

  update(time, delta) {
    if (this.gameOver) return;
    const spd = MANIFEST.game_config.physics?.player_speed || 100;
    const k   = this.keys;
    let vx = 0, vy = 0;
    if (k.left.isDown)  vx = -spd;
    if (k.right.isDown) vx =  spd;
    if (k.up.isDown)    vy = -spd;
    if (k.down.isDown)  vy =  spd;
    if (vx && vy) { vx *= 0.707; vy *= 0.707; }
    this.player.body.setVelocity(vx, vy);
    if (vx || vy) {
      if (this.anims.exists('player_walk')) this.player.play('player_walk', true);
      if (vx < 0) this.player.setFlipX(true);
      else if (vx > 0) this.player.setFlipX(false);
    } else {
      if (this.anims.exists('player_idle')) this.player.play('player_idle', true);
    }

    // Attack — fire pistol in facing direction (Sprint 8D feedback)
    if (Phaser.Input.Keyboard.JustDown(k.attack)) {
      this._fire();
    }

    // ── Civilians — always wander, never hostile (Sprint 8D) ──
    this.npcs.children.each(npc => {
      if (!npc.active) return;
      npc.wanderTimer -= 16;
      if (npc.wanderTimer <= 0) { npc.wanderAngle += (Math.random()-0.5)*1.5; npc.wanderTimer = 1000; }
      npc.body.setVelocity(Math.cos(npc.wanderAngle)*25, Math.sin(npc.wanderAngle)*25);
    });

    // ── Police — chase while wanted > 0 (Sprint 8D) ───────────
    this.police.children.each(cop => {
      if (!cop.active) return;
      const angle = Phaser.Math.Angle.Between(cop.x, cop.y, this.player.x, this.player.y);
      cop.body.setVelocity(Math.cos(angle) * cop.speed, Math.sin(angle) * cop.speed);
      cop.setFlipX(this.player.x < cop.x);
    });

    // ── Wanted decay — 1 star per 20s without crime (Sprint 8D) ──
    if (this.wanted > 0 && this.time.now - this._lastCrimeTime > 20000) {
      this._setWanted(this.wanted - 1);
    }

    // ── Arrest check (Sprint 8D) ──────────────────────────────
    this._checkBusted(delta);

    // Mission check
    if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.missionX, this.missionY) < 30) {
      this.cash += 500;
      this.events.emit('cashChanged', this.cash);
      this.missionX = Phaser.Math.Between(100, this.worldW - 100);
      this.missionY = Phaser.Math.Between(100, this.worldH - 100);
      this.missionMarker.setPosition(this.missionX, this.missionY);
    }
  }
}

// ============================================================
// TURN-BASED RPG OVERWORLD — Explore tilemap, random encounters
// ============================================================
class TurnOverworldScene extends Phaser.Scene {
  constructor() { super('TurnOverworldScene'); }

  init(data) {
    // Restore state if returning from battle
    this.playerHp   = data?.playerHp   || MANIFEST.game_config.battle?.player_hp  || 80;
    this.playerMp   = data?.playerMp   || MANIFEST.game_config.battle?.player_mp  || 40;
    this.maxHp      = this.playerHp;
    this.maxMp      = this.playerMp;
    this.overworldScore = data?.overworldScore || 0;
    this.encounters = data?.encounters || 0;
    this.maxEncounters = MANIFEST.game_config.battle?.max_encounters || 5;
    this.returnX    = data?.returnX;
    this.returnY    = data?.returnY;
  }

  create() {
    const cfg = MANIFEST.game_config;
    const p   = MANIFEST.palette;

    this.gameOver = false;
    this._stepCounter = 0;
    this._encounterCooldown = 0;

    // ── World — TilemapRenderer ────────────────────────────
    const tileRenderer = new TilemapRenderer(this);
    const { walls, playerSpawn, enemySpawns: tileEnemySpawns, itemSpawns, worldWidth, worldHeight } = tileRenderer.build();
    this.walls  = walls;
    this.worldW = worldWidth;
    this.worldH = worldHeight;
    this.tileGrid = MANIFEST?.tilemap?.grid;

    // No tilemap (smoke path) — virtual gym + grass encounter zones (Sprint 8E)
    this.fallbackGym = null;
    this.fallbackGrassZones = null;
    if (!this.tileGrid) {
      this.fallbackGym = { x: worldWidth * 0.72, y: worldHeight * 0.72 };
      const g = this.add.rectangle(this.fallbackGym.x, this.fallbackGym.y, 16, 16, 0xaa3333).setDepth(3);
      g.setStrokeStyle(1, 0xffdddd);
      this.add.text(this.fallbackGym.x - 5, this.fallbackGym.y - 6, 'G',
        { fontSize: '10px', color: '#ffdddd',
          stroke: '#000000', strokeThickness: 2 }).setDepth(4);
      if (tileEnemySpawns.length > 0) this.fallbackGrassZones = tileEnemySpawns;
    }

    // ── Player ───────────────────────────────────────────────
    const startX = this.returnX || playerSpawn.x;
    const startY = this.returnY || playerSpawn.y;
    this.player = this.physics.add.sprite(startX, startY, 'player', 0);
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(10, 10);
    this.player.setDepth(10).setScale(1.2);
    if (this.anims.exists('player_idle')) this.player.play('player_idle');

    // ── Collision ──────────────────────────────────────────────
    this.physics.add.collider(this.player, this.walls);
    // In TurnOverworldScene.create(), same addition:
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
    this.cameras.main.setZoom(1.5);
    // ── Input ─────────────────────────────────────────────────
    this.keys = this.input.keyboard.addKeys({
      up:    Phaser.Input.Keyboard.KeyCodes.W,
      down:  Phaser.Input.Keyboard.KeyCodes.S,
      left:  Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D,
      interact: Phaser.Input.Keyboard.KeyCodes.SPACE,
    });

    // ── HUD ────────────────────────────────────────────────────
    this.scene.launch('TurnOverworldHUD', { gameScene: this });

    // ── Heal if entering from fresh start ───────────────────────
    if (!this.returnX) {
      this.playerHp = this.maxHp;
      this.playerMp = this.maxMp;
    }
  }

  update() {
    if (this.gameOver) return;

    const spd = MANIFEST.game_config.physics?.player_speed || 90;
    const k   = this.keys;
    let vx = 0, vy = 0;
    if (k.left.isDown)  vx = -spd;
    if (k.right.isDown) vx =  spd;
    if (k.up.isDown)    vy = -spd;
    if (k.down.isDown)  vy =  spd;
    if (vx && vy) { vx *= 0.707; vy *= 0.707; }
    this.player.body.setVelocity(vx, vy);
    if (vx || vy) {
      if (this.anims.exists('player_walk')) this.player.play('player_walk', true);
      if (vx < 0) this.player.setFlipX(true);
      else if (vx > 0) this.player.setFlipX(false);
      this._stepCounter++;
    } else {
      if (this.anims.exists('player_idle')) this.player.play('player_idle', true);
    }

    // ── Gym — boss battle / win condition (Sprint 8E) ─────────
    if (this.fallbackGym && !this.gymBeaten &&
        Phaser.Math.Distance.Between(this.player.x, this.player.y,
          this.fallbackGym.x, this.fallbackGym.y) < 20) {
      this._triggerBossBattle();
      return;
    }

    // ── Fallback tall-grass encounter zones (no tilemap) ──────
    if (this.fallbackGrassZones) {
      for (const z of this.fallbackGrassZones) {
        if (Math.abs(this.player.x - z.x) < 26 && Math.abs(this.player.y - z.y) < 22) {
          if (Math.random() < 0.012 && this.time.now > this._encounterCooldown) {
            this._encounterCooldown = this.time.now + 3000;
            this._triggerBattle();
            return;
          }
        }
      }
    }

    // ── Check tile under player ─────────────────────────────
    if (!this.tileGrid) return;
    const tx = Math.floor(this.player.x / TILE);
    const ty = Math.floor(this.player.y / TILE);
    const tileId = this.tileGrid[ty]?.[tx];
    if (!tileId) return;

    // ── Tall grass — random encounter ────────────────────────
    const tileDefs = MANIFEST?.tilemap?.tile_defs;
    if (tileDefs?.[tileId]?.spawn_enemy) {
      const encounterChance = 0.015;
      if (Math.random() < encounterChance && this.time.now > this._encounterCooldown) {
        this._encounterCooldown = this.time.now + 3000;
        this._triggerBattle();
        return;
      }
    }

    // ── Town / item tiles — heal ─────────────────────────────
    if (tileDefs?.[tileId]?.spawn_item && Phaser.Input.Keyboard.JustDown(k.interact)) {
      this.playerHp = this.maxHp;
      this.playerMp = this.maxMp;
      this.events.emit('healed');
    }

    // ── Gym — boss battle / win condition (Sprint 8E) ─────────
    if (tileId === 'gym' && !this.gymBeaten) {
      this._triggerBossBattle();
      return;
    }
  }

  _triggerBossBattle() {
    const cfg = MANIFEST.game_config;
    const bossMult = cfg.boss?.hp_mult || 5;
    const enemyHp = Math.floor((cfg.enemy?.base_hp || 60) * bossMult);
    this.scene.start('TurnBasedScene', {
      fromOverworld: true,
      isBoss: true,
      playerHp: this.playerHp,
      playerMp: this.playerMp,
      maxHp: this.maxHp,
      maxMp: this.maxMp,
      overworldScore: this.overworldScore,
      encounters: this.encounters,
      maxEncounters: this.maxEncounters,
      returnX: this.player.x,
      returnY: this.player.y,
      enemyHp,
      battleNum: this.encounters + 1,
    });
  }

  _triggerBattle() {
    const cfg = MANIFEST.game_config;
    const scale = 1 + this.encounters * 0.3;
    const enemyHp = Math.floor((cfg.enemy?.base_hp || 60) * scale);
    this.scene.start('TurnBasedScene', {
      fromOverworld: true,
      playerHp: this.playerHp,
      playerMp: this.playerMp,
      maxHp: this.maxHp,
      maxMp: this.maxMp,
      overworldScore: this.overworldScore,
      encounters: this.encounters,
      maxEncounters: this.maxEncounters,
      returnX: this.player.x,
      returnY: this.player.y,
      enemyHp,
      battleNum: this.encounters + 1,
    });
  }
}

// ============================================================
// TURN BASED BATTLE SCENE — Pokemon / Final Fantasy style
// ============================================================
class TurnBasedScene extends Phaser.Scene {
  constructor() { super('TurnBasedScene'); }

  init(data) {
    this._initData = data || {};
    this.fromOverworld = this._initData.fromOverworld || false;
    this.isBoss = this._initData.isBoss || false;  // Sprint 8E
    if (this.fromOverworld) {
      this.playerHp  = this._initData.playerHp;
      this.playerMp  = this._initData.playerMp;
      this.maxHp     = this._initData.maxHp;
      this.maxMp     = this._initData.maxMp;
      this.overworldScore = this._initData.overworldScore || 0;
      this.encounters= this._initData.encounters || 0;
      this.maxEncounters = this._initData.maxEncounters || 5;
      this.returnX   = this._initData.returnX;
      this.returnY   = this._initData.returnY;
      this.enemyHp   = this._initData.enemyHp;
    }
  }

  create() {
    const cfg  = MANIFEST.game_config;
    const p    = MANIFEST.palette;
    const bcfg = cfg.battle || {};

    // Battle state
    if (!this.fromOverworld) {
      this.playerHp  = bcfg.player_hp  || 80;
      this.playerMp  = bcfg.player_mp  || 40;
      this.maxHp     = this.playerHp;
      this.maxMp     = this.playerMp;
      this.enemyHp   = cfg.enemy?.base_hp || 60;
      this.overworldScore = 0;
      this.encounters= 0;
      this.maxEncounters= 5;
    }
    this.enemyMaxHp= this.enemyHp;
    this.score     = 0;
    this.turn      = 'player';
    this.busy      = false;
    this.battle    = this.fromOverworld ? (this._initData.battleNum || 1) : 0;
    this.maxBattles= this.fromOverworld ? 1 : 5;

    const toColor = (v, fallback) => {
      if (typeof v === 'number') return v;
      return parseInt((v || fallback).replace('#',''), 16);
    };

    const bgColor    = toColor(p.background, '#0a0a1a');
    const floorColor = toColor(p.secondary,  '#1a1a3a');
    const menuColor  = 0x000000;

    // ── Background ────────────────────────────────────────────
    this.add.rectangle(W/2, H/2, W, H, bgColor).setDepth(0);
    // Battle floor
    this.add.rectangle(W/2, H*0.72, W, H*0.56, floorColor).setDepth(1);
    // Sky gradient hint
    this.add.rectangle(W/2, H*0.25, W, H*0.5, toColor(p.primary, '#050510')).setDepth(1);

    // ── Enemy sprite (large, top right) ───────────────────────
    this.enemySprite = this.add.image(320, 110, 'boss', 0)
      .setDepth(5).setScale(this.isBoss ? 4.5 : 3).setFlipX(false);
    if (!this.textures.get('boss').has(0)) {
      // Fallback colored rectangle
      const g = this.make.graphics({add:false});
      g.fillStyle(toColor(p.accent, '#8b0000'));
      g.fillRect(0,0,40,40);
      g.fillStyle(0xff0000); g.fillRect(5,5,12,12); g.fillRect(23,5,12,12);
      g.generateTexture('boss_fallback',40,40); g.destroy();
      this.enemySprite = this.add.image(320, 110, 'boss_fallback').setDepth(5).setScale(2);
    }

    // Enemy HP bar (above enemy)
    this.add.rectangle(320, 52, 120, 12, 0x000000, 0.8).setDepth(6);
    this.add.rectangle(260, 52, 120, 8, 0x440000, 1).setDepth(7).setOrigin(0, 0.5);
    this.enemyHpBar = this.add.rectangle(260, 52, 120, 8, 0xff2200, 1).setDepth(8).setOrigin(0, 0.5);
    this.enemyHpText = this.add.text(260, 42, `HP ${this.enemyHp}/${this.enemyMaxHp}`,
      { fontSize:'7px', fontFamily:'Courier New', color:'#ff8888' }).setDepth(9);
    this.battleLabel = this.add.text(260, 32,
      this.isBoss ? 'GYM LEADER BATTLE' : `BATTLE ${this.battle+1}/${this.maxBattles}`,
      { fontSize:'7px', fontFamily:'Courier New',
        color: this.isBoss ? '#ff6666' : '#888' }).setDepth(9);

    // ── Player sprite (small, bottom left) ────────────────────
    this.playerSprite = this.add.image(120, 185, 'player', 0)
      .setDepth(5).setScale(2.5);

    // ── Player stats panel ─────────────────────────────────────
    this.add.rectangle(100, 248, 190, 60, menuColor, 0.9).setDepth(6);
    this.add.text(12, 224, MANIFEST.title || 'HERO',
      { fontSize:'9px', fontFamily:'Courier New', color: p.hud_text||'#ffcc00' }).setDepth(7);
    this.add.text(12, 236, 'HP', { fontSize:'8px', fontFamily:'Courier New', color:'#ff4444' }).setDepth(7);
    this.add.rectangle(35, 240, 80, 6, 0x440000).setDepth(7).setOrigin(0,0.5);
    this.hpBar = this.add.rectangle(35, 240, 80, 6, 0xff2200).setDepth(8).setOrigin(0,0.5);
    this.hpText = this.add.text(120, 234, `${this.playerHp}/${this.maxHp}`,
      { fontSize:'7px', fontFamily:'Courier New', color:'#ff8888' }).setDepth(7);
    this.add.text(12, 248, 'MP', { fontSize:'8px', fontFamily:'Courier New', color:'#8844ff' }).setDepth(7);
    this.add.rectangle(35, 252, 80, 6, 0x220044).setDepth(7).setOrigin(0,0.5);
    this.mpBar = this.add.rectangle(35, 252, 80, 6, 0x8800ff).setDepth(8).setOrigin(0,0.5);
    this.mpText = this.add.text(120, 246, `${this.playerMp}/${this.maxMp}`,
      { fontSize:'7px', fontFamily:'Courier New', color:'#aa88ff' }).setDepth(7);
    this.scoreText = this.add.text(12, 261, 'SCORE 0',
      { fontSize:'7px', fontFamily:'Courier New', color:'#888' }).setDepth(7);

    // ── Action menu ────────────────────────────────────────────
    this.add.rectangle(360, 248, 190, 60, menuColor, 0.9).setDepth(6);
    this.menuItems = ['ATTACK', 'MAGIC', 'HEAL', 'RUN'];
    this.selectedAction = 0;
    this.menuTexts = this.menuItems.map((item, i) => {
      const col = i % 2, row = Math.floor(i/2);
      return this.add.text(275 + col*90, 228 + row*22, `▶ ${item}`,
        { fontSize:'9px', fontFamily:'Courier New',
          color: i === 0 ? '#ffffff' : '#888888' }).setDepth(7);
    });

    // ── Battle log ─────────────────────────────────────────────
    this.battleLog = this.add.text(W/2, 208,
      'YOUR TURN — CHOOSE ACTION',
      { fontSize:'8px', fontFamily:'Courier New', color:'#aaaaaa' })
      .setDepth(7).setOrigin(0.5);

    // ── Input ──────────────────────────────────────────────────
    this.keys = this.input.keyboard.addKeys({
      left:   Phaser.Input.Keyboard.KeyCodes.LEFT,
      right:  Phaser.Input.Keyboard.KeyCodes.RIGHT,
      up:     Phaser.Input.Keyboard.KeyCodes.UP,
      down:   Phaser.Input.Keyboard.KeyCodes.DOWN,
      confirm:Phaser.Input.Keyboard.KeyCodes.SPACE,
      confirm2:Phaser.Input.Keyboard.KeyCodes.ENTER,
    });
  }

  _updateMenu() {
    this.menuTexts.forEach((t, i) => {
      t.setText(`${i === this.selectedAction ? '▶' : ' '} ${this.menuItems[i]}`);
      t.setColor(i === this.selectedAction ? '#ffffff' : '#888888');
    });
  }

  _log(msg) { this.battleLog.setText(msg); }

  _updateBars() {
    this.hpBar.width    = 80 * Math.max(0, this.playerHp) / this.maxHp;
    this.mpBar.width    = 80 * Math.max(0, this.playerMp) / this.maxMp;
    this.enemyHpBar.width = 120 * Math.max(0, this.enemyHp) / this.enemyMaxHp;
    this.hpText.setText(`${Math.max(0,this.playerHp)}/${this.maxHp}`);
    this.mpText.setText(`${Math.max(0,this.playerMp)}/${this.maxMp}`);
    this.enemyHpText.setText(`HP ${Math.max(0,this.enemyHp)}/${this.enemyMaxHp}`);
    this.scoreText.setText(`SCORE ${this.score}`);
  }

  _playerAction() {
    if (this.busy) return;
    this.busy = true;
    const bcfg = MANIFEST.game_config.battle || {};
    const action = this.menuItems[this.selectedAction];

    if (action === 'ATTACK') {
      const dmg = (bcfg.base_attack || 20) + Phaser.Math.Between(-5, 5);
      this.enemyHp -= dmg;
      this._log(`You attacked for ${dmg} damage!`);
      this.cameras.main.shake(80, 0.006);
      this.enemySprite.setTint(0xff0000);
      this.time.delayedCall(200, () => { this.enemySprite.clearTint(); this._afterPlayerTurn(); });

    } else if (action === 'MAGIC') {
      if (this.playerMp < 10) { this._log('Not enough MP!'); this.busy = false; return; }
      const dmg = (bcfg.base_magic || 30) + Phaser.Math.Between(-3, 8);
      this.playerMp -= 10;
      this.enemyHp  -= dmg;
      this._log(`Magic hit for ${dmg} damage!`);
      this.enemySprite.setTint(0xaa00ff);
      this.time.delayedCall(300, () => { this.enemySprite.clearTint(); this._afterPlayerTurn(); });

    } else if (action === 'HEAL') {
      if (this.playerMp < 8) { this._log('Not enough MP!'); this.busy = false; return; }
      const heal = (bcfg.base_heal || 25) + Phaser.Math.Between(-5, 5);
      this.playerMp -= 8;
      this.playerHp  = Math.min(this.maxHp, this.playerHp + heal);
      this._log(`Healed ${heal} HP!`);
      this.playerSprite.setTint(0x44ff44);
      this.time.delayedCall(300, () => { this.playerSprite.clearTint(); this._afterPlayerTurn(); });

    } else if (action === 'RUN') {
      this._log('Got away safely!');
      this.time.delayedCall(800, () => this._endBattle(false));
      return;
    }
    this._updateBars();
  }

  _afterPlayerTurn() {
    this._updateBars();
    if (this.enemyHp <= 0) {
      this.score += 200 + this.battle * 50;
      this._log(`Enemy defeated! +${200 + this.battle * 50} pts`);
      this.enemySprite.setAlpha(0.3);
      this.time.delayedCall(1200, () => this._endBattle(true));
      return;
    }
    // Enemy turn
    this._log('Enemy is thinking...');
    this.time.delayedCall(800, () => this._enemyTurn());
  }

  _enemyTurn() {
    const bossMult = this.isBoss ? (MANIFEST.game_config.boss?.attack_mult || 2) : 1;
    const atkCfg = (MANIFEST.game_config.enemy?.base_attack || 15) * bossMult;
    const dmg = atkCfg + Phaser.Math.Between(-4, 4);
    this.playerHp -= dmg;
    this._log(`Enemy attacks for ${dmg} damage!`);
    this.playerSprite.setTint(0xff0000);
    this._updateBars();
    this.time.delayedCall(400, () => {
      this.playerSprite.clearTint();
      if (this.playerHp <= 0) {
        this._log('You were defeated...');
        this.time.delayedCall(1000, () => this._gameOver());
      } else {
        this._log('YOUR TURN — CHOOSE ACTION');
        this.busy = false;
      }
    });
  }

  _endBattle(won) {
    this.battle++;
    const totalScore = this.overworldScore + this.score;
    if (won) this.playerMp = Math.min(this.maxMp, this.playerMp + 5); // Restore some MP

    // ── Gym boss — the run's win condition (Sprint 8E) ────────
    if (this.isBoss) {
      if (won) {
        this._showEndScreen('VICTORY! GYM BADGE EARNED!', '#44ff44',
          totalScore + 1000, `BATTLES WON: ${this.encounters + 1}`);
      } else {
        // Loss — return to overworld at the gym entrance to heal and retry
        this.time.delayedCall(1200, () => {
          this.scene.start('TurnOverworldScene', {
            playerHp: Math.max(1, Math.floor(this.maxHp * 0.3)),
            playerMp: this.playerMp,
            overworldScore: totalScore,
            encounters: this.encounters,
            maxEncounters: this.maxEncounters,
            returnX: this.returnX,
            returnY: this.returnY,
          });
        });
      }
      return;
    }

    if (this.fromOverworld) {
      // Return to overworld after single battle
      const newEncounters = won ? this.encounters + 1 : this.encounters;
      if (won && newEncounters >= this.maxEncounters) {
        this._showEndScreen('ALL ENCOUNTERS CLEAR!', '#44ff44', totalScore);
        return;
      }
      this.time.delayedCall(1200, () => {
        this.scene.start('TurnOverworldScene', {
          playerHp: this.playerHp,
          playerMp: this.playerMp,
          overworldScore: totalScore,
          encounters: newEncounters,
          maxEncounters: this.maxEncounters,
          returnX: this.returnX,
          returnY: this.returnY,
        });
      });
      return;
    }

    if (this.battle >= this.maxBattles) { this._victory(); return; }

    // Next enemy — gets stronger
    const scale = 1 + this.battle * 0.3;
    this.enemyHp    = Math.floor((MANIFEST.game_config.enemy?.base_hp || 60) * scale);
    this.enemyMaxHp = this.enemyHp;
    this.enemySprite.setAlpha(1).clearTint();
    this.battleLabel.setText(`BATTLE ${this.battle+1}/${this.maxBattles}`);
    this._log(`BATTLE ${this.battle+1} — NEW ENEMY APPEARS!`);
    this._updateBars();
    this.time.delayedCall(800, () => { this.busy = false; });
  }

  _victory() {
    this.busy = true;
    this.score += 1000;
    const totalScore = this.overworldScore + this.score;
    this._showEndScreen('VICTORY!', '#44ff44', totalScore);
  }

  _gameOver() {
    this.busy = true;
    // Boss loss — never a dead end: return to overworld to heal and retry (Sprint 8E)
    if (this.isBoss && this.fromOverworld) {
      this._log('Defeated by the gym leader...');
      const totalScore = this.overworldScore + this.score;
      this.time.delayedCall(1400, () => {
        this.scene.start('TurnOverworldScene', {
          playerHp: Math.max(1, Math.floor(this.maxHp * 0.3)),
          playerMp: this.playerMp,
          overworldScore: totalScore,
          encounters: this.encounters,
          maxEncounters: this.maxEncounters,
          returnX: this.returnX,
          returnY: this.returnY,
        });
      });
      return;
    }
    if (this.fromOverworld) {
      this._showEndScreen('DEFEAT...', '#ff0000', this.overworldScore + this.score);
    } else {
      this._showEndScreen('DEFEAT...', '#ff0000');
    }
  }

  _showEndScreen(title, color, finalScore, subtitle) {
    const s = finalScore ?? this.score;
    this.add.rectangle(W/2,H/2,W,H,0x000000,0.8).setDepth(40);
    this.add.text(W/2,H/2-25, title,
      { fontSize:'24px', fontFamily:'Courier New', color, stroke:'#000', strokeThickness:3 })
      .setDepth(41).setOrigin(0.5);
    this.add.text(W/2,H/2+5, `SCORE: ${s}`,
      { fontSize:'11px', fontFamily:'Courier New', color:'#ffcc00' })
      .setDepth(41).setOrigin(0.5);
    this.add.text(W/2,H/2+22, subtitle ?? `BATTLES WON: ${this.battle}/${this.maxBattles}`,
      { fontSize:'9px', fontFamily:'Courier New', color:'#aaaaaa' })
      .setDepth(41).setOrigin(0.5);
    this.add.text(W/2,H/2+38, 'REFRESH TO RETRY',
      { fontSize:'8px', fontFamily:'Courier New', color:'#666' })
      .setDepth(41).setOrigin(0.5);
  }

  update() {
    if (this.busy || this.turn !== 'player') return;
    const k = this.keys;

    if (Phaser.Input.Keyboard.JustDown(k.left)) {
      this.selectedAction = (this.selectedAction + this.menuItems.length - 1) % this.menuItems.length;
      this._updateMenu();
    }
    if (Phaser.Input.Keyboard.JustDown(k.right)) {
      this.selectedAction = (this.selectedAction + 1) % this.menuItems.length;
      this._updateMenu();
    }
    if (Phaser.Input.Keyboard.JustDown(k.confirm) || Phaser.Input.Keyboard.JustDown(k.confirm2)) {
      this._playerAction();
    }
  }
}

// ============================================================
// PHASER BOOT — routes to correct template based on manifest
// ============================================================
function bootPhaser() {
  const template   = MANIFEST.template || 'wave_shooter';
  const useGravity = template === 'side_scroll_platformer';

  const CONTROLS = {
    wave_shooter:         'WASD — MOVE  |  MOUSE — AIM & SHOOT  |  R — RELOAD',
    side_scroll_platformer:'A/D — MOVE  |  W / SPACE — JUMP',
    top_down_action_rpg:  'WASD — MOVE  |  SPACE — ATTACK/CHEST  |  E — MAGIC  |  Q — POTION',
    open_world_sandbox:   'WASD — MOVE  |  SPACE — ATTACK  |  ★ FIND MISSIONS',
    turn_based_rpg:       'WASD — MOVE  |  SPACE — INTERACT  |  ← → — BATTLE MENU',
  };
  const footer = document.getElementById('footer');
  if (footer) footer.textContent = CONTROLS[template] || CONTROLS.wave_shooter;

  const SCENE_MAP = {
    wave_shooter:          [PreloadScene, GameScene, HUDScene],
    side_scroll_platformer:[PreloadScene, PlatformerScene, PlatformerHUD],
    top_down_action_rpg:   [PreloadScene, TopDownRPGScene, TopDownHUD],
    open_world_sandbox:    [PreloadScene, OpenWorldScene, OpenWorldHUD],
    turn_based_rpg:        [PreloadScene, TurnOverworldScene, TurnOverworldHUD, TurnBasedScene],
  };
  const scenes = SCENE_MAP[template] || SCENE_MAP.wave_shooter;

  const config = {
    type: Phaser.AUTO,
    width: W, height: H,
    backgroundColor: '#0d0500',
    parent: 'game-container',
    pixelArt: true,
    antialias: false,
    physics: {
      default: 'arcade',
      arcade: {
        gravity: { y: useGravity ? (MANIFEST.game_config?.physics?.gravity || 800) : 0 },
        debug: false
      }
    },
    scene: scenes
  };

  const game = new Phaser.Game(config);
  window._game = game;  // exposed for headless smoke tests
}

// ============================================================
// CHIPTUNE AUDIO — inline Web Audio API (no CDN, works in Firefox)
// Generates NES-style beeps from the manifest's music_vibe
// ============================================================
function initAudio() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();

    const vibe  = MANIFEST.debug?.music_vibe  || 'intense_action';
    const tempo = MANIFEST.debug?.music_tempo || 'fast';

    // BPM map
    const bpmMap = { slow: 72, medium: 96, fast: 132, frantic: 168 };
    const bpm    = bpmMap[tempo] || 120;
    const beat   = 60 / bpm;

    // Scale notes (MIDI-ish frequencies)
    const scales = {
      intense_action: [220, 247, 277, 330, 370, 415, 466, 440],
      dark_horror:    [220, 233, 261, 311, 330, 349, 392, 415],
      epic_adventure: [261, 293, 329, 349, 392, 440, 493, 523],
      urban_gritty:   [220, 261, 311, 330, 392, 415, 466, 440],
      mysterious:     [246, 261, 293, 311, 370, 392, 440, 466],
    };
    const notes = scales[vibe] || scales.intense_action;

    function playNote(freq, startTime, duration, volume = 0.08) {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    }

    // Generate a 4-bar loop
    function playLoop(startTime) {
      const barLen = beat * 4;
      for (let bar = 0; bar < 4; bar++) {
        for (let step = 0; step < 8; step++) {
          const t = startTime + bar * barLen + step * beat * 0.5;
          // Melody on pulse 1
          playNote(notes[step % notes.length], t, beat * 0.45, 0.07);
          // Bass on triangle (octave down)
          if (step % 2 === 0) {
            playNote(notes[step % notes.length] / 2, t, beat * 0.9, 0.05);
          }
          // Drum click on beats 1 and 3
          if (step === 0 || step === 4) {
            const noise = ctx.createOscillator();
            const ng    = ctx.createGain();
            noise.connect(ng); ng.connect(ctx.destination);
            noise.type = 'square';
            noise.frequency.value = 80;
            ng.gain.setValueAtTime(0.1, t);
            ng.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            noise.start(t); noise.stop(t + 0.06);
          }
        }
      }
      // Schedule next loop
      const loopDuration = beat * 4 * 4;
      setTimeout(() => playLoop(ctx.currentTime + 0.1), (loopDuration - 0.2) * 1000);
    }

    playLoop(ctx.currentTime + 0.1);
    window._audioStarted = true;
    console.log('[Audio] Chiptune BGM started via Web Audio API');
  } catch(e) {
    console.warn('[Audio] Web Audio failed:', e);
  }
}

// Start audio on first click — browser requires user gesture
document.addEventListener('click', () => {
  if (!window._audioStarted) initAudio();
}, { once: true });

// ============================================================
// BOOT — deferred to script end so all scene classes are
// evaluated first (the fallback path boots Phaser synchronously)
// ============================================================
loadManifest();
</script>
